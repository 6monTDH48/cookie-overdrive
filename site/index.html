.btn {

.btn.pink   { --c1: #ff6be6; --c2: #ff2bd6; --c3: #b0108f; }
.btn.gold   { --c1: #ffe066; --c2: #ffb800; --c3: #c07a00; }
.btn.cyan   { --c1: #7ffaff; --c2: #1fd6ff; --c3: #0a8fb8; }
.btn.red    { --c1: #ff8095; --c2: #ff3d5e; --c3: #b3142f; }
.btn.dark   { --c1: #3a2a70; --c2: #2a1b58; --c3: #170d38; }
.btn.big    { font-size: 24px; padding: 13px 26px 15px; border-radius: 18px; }
.btn.small  { font-size: 14px; padding: 6px 10px 8px; border-radius: 11px; border-width: 2px; }

/* Animated RGB border helper: wrap an element with .rgb-border */
.rgb-border { position: relative; isolation: isolate; }
.rgb-border::before {
  content: ''; position: absolute; inset: -3px; border-radius: inherit; z-index: -1;
  background: conic-gradient(from calc(var(--h) * 1deg), #ff004c, #ff8a00, #ffe600, #2bff88, #00d5ff, #7a5cff, #ff2bd6, #ff004c);
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }

  /* games */

  .gcard { position: relative; overflow: hidden; border-radius: 20px; padding: 26px 12px 12px; min-height: 176px; display: flex; flex-direction: column; gap: 6px; border: 3px solid var(--stroke); box-shadow: 0 4px 0 var(--stroke); background: linear-gradient(150deg, var(--gc) -10%, #1d0f45 62%); }
  .gcard .emo { position: absolute; right: -6px; top: -8px; font-size: 64px; transform: rotate(14deg); filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); opacity: .95; transition: transform .3s cubic-bezier(.3,1.8,.5,1); }
  .gcard:hover .emo { transform: rotate(-4deg) scale(1.12); }
  .gcard .nm { font-size: 20px; line-height: 1.05; max-width: 75%; position: relative; }
  .gcard .tg { font-size: 12.5px; color: #eee6ff; line-height: 1.3; position: relative; }
  .gcard .best { font-family: var(--f-mono); font-size: 12px; color: var(--gold); margin-top: auto; }
  .gcard .btn { align-self: stretch; }
  .gcard.locked { filter: grayscale(.9); }
  .gcard.locked .lock { font-size: 12.5px; color: #fff; }
  .gcard .new { position: absolute; left: 10px; top: -2px; }
  .ribbon { font-family: var(--f-display); font-size: 12px; padding: 3px 8px; border-radius: 0 0 10px 10px; background: var(--red); border: 2px solid var(--stroke); border-top: 0; }
  .mprog { height: 8px; border-radius: 999px; background: rgba(0,0,0,.4); overflow: hidden; border: 2px solid var(--stroke); }
  .mprog > i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc), var(--acc2)); }

  /* pets */
  .eggs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .egg { border-radius: 18px; padding: 10px 8px; background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.08); display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .egg .shape { width: 54px; height: 68px; border-radius: 50% 50% 50% 50% / 60% 60% 42% 42%; border: 3px solid var(--stroke); position: relative; box-shadow: inset -6px -8px 0 rgba(0,0,0,.18), inset 5px 6px 0 rgba(255,255,255,.35); animation: eggIdle 2.4s ease-in-out infinite; }
  .egg:hover .shape { animation: eggShake .5s ease-in-out infinite; }
  @keyframes eggIdle { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(3deg); } }
  @keyframes eggShake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
  .egg .nm { font-family: var(--f-display); font-size: 14.5px; line-height: 1.1; }
  .egg .odds { font-size: 11px; line-height: 1.35; }
  .egg .btn { width: 100%; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot { height: 76px; border-radius: 16px; border: 2px dashed rgba(255,255,255,.18); display: grid; place-items: center; font-size: 12px; color: var(--muted); position: relative; background: rgba(0,0,0,.2); }
  .slot.full { border-style: solid; border-width: 3px; font-size: 38px; }
  .petsum { font-size: 13px; margin-top: 8px; color: var(--lime); font-weight: 600; text-align: center; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 8px; }
  .pet { position: relative; border-radius: 16px; padding: 8px 4px 7px; background: rgba(255,255,255,.05); border: 3px solid var(--rc, #555); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; transition: transform .1s; }
  .pet:hover { transform: translateY(-2px); }
  .pet .e { font-size: 34px; filter: drop-shadow(0 0 8px var(--rg, transparent)); }
  .pet .n { font-size: 11.5px; font-weight: 600; line-height: 1.15; }
  .pet .r { font-size: 10.5px; font-family: var(--f-display); color: var(--rc); letter-spacing: .03em; }
  .pet .lv { position: absolute; top: 3px; left: 5px; font-family: var(--f-display); font-size: 11px; color: var(--gold); }
  .pet.eq::after { content: ''; position: absolute; top: -8px; right: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--green) var(--ic-check) center / 72% no-repeat; border: 2px solid var(--stroke); }
  .rgbc { animation: rgbBorder 2s linear infinite; }
  @keyframes rgbBorder { 0% { border-color: #ff004c; } 20% { border-color: #ffe600; } 40% { border-color: #2bff88; } 60% { border-color: #00d5ff; } 80% { border-color: #ff2bd6; } 100% { border-color: #ff004c; } }

  /* style */
  .skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .skin { border-radius: 16px; padding: 8px 6px; background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.08); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; text-align: center; transition: transform .1s; }
  .skin:hover { transform: translateY(-2px); }
  .skin.cur { border-color: var(--acc); box-shadow: 0 0 0 2px hsl(var(--h) 100% 60% / .35); }
  .skin canvas { width: 64px; height: 64px; }
  .skin .n { font-family: var(--f-display); font-size: 13.5px; line-height: 1.1; }
  .skin .p { font-family: var(--f-mono); font-size: 12px; font-weight: 700; }
  .skin .p.ok { color: var(--lime); } .skin .p.no { color: #ff8a9c; } .skin .p.eq { color: var(--cyan); }
  .skin.lockd canvas { filter: brightness(.25) grayscale(1); }
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .theme { border-radius: 16px; overflow: hidden; border: 3px solid var(--stroke); cursor: pointer; background: #000; transition: transform .1s; text-align: left; padding: 0; }
  .theme:hover { transform: translateY(-2px); }
  .theme .pv { height: 58px; }
  .theme .info { padding: 6px 8px; background: rgba(15,8,38,.95); display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .theme .n { font-family: var(--f-display); font-size: 13.5px; }
  .theme.cur { border-color: var(--acc); }

  /* quests & achievements */
  .qlist { display: grid; gap: 8px; }
  .quest { display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 18px; background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.08); }
  .quest.done { border-color: var(--lime); background: linear-gradient(90deg, rgba(182,255,59,.14), rgba(255,255,255,.04)); }
  .quest .e { font-size: 28px; text-align: center; }
  .quest .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
  .quest .pr { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
  .quest .pr .mprog { flex: 1; }
  .quest .acts { display: flex; flex-direction: column; gap: 5px; align-items: stretch; }
  .achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
  .ach { aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center; font-size: 23px; background: radial-gradient(circle at 30% 25%, #6a4fd0, #231255 70%); border: 2px solid var(--stroke); cursor: help; position: relative; }
  .ach.no { background: rgba(255,255,255,.04); filter: grayscale(1); opacity: .45; font-size: 18px; }
  .achinfo { min-height: 40px; margin-top: 8px; font-size: 13px; padding: 8px 10px; border-radius: 12px; background: rgba(0,0,0,.25); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { padding: 8px 10px; border-radius: 12px; background: rgba(0,0,0,.22); }
  .stat .k { font-size: 11.5px; color: var(--muted); }
  .stat .v { font-family: var(--f-mono); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

  /* rebirth */
  .rb-hero { text-align: center; padding: 16px 12px; border-radius: 22px; background: radial-gradient(circle at 50% 0%, hsl(var(--h) 90% 45% / .5), transparent 70%), rgba(0,0,0,.25); border: 3px solid var(--stroke); }
  .rb-hero .big { font-size: 46px; line-height: 1; }
  .rb-hero .gain { font-size: 30px; color: var(--gold); margin: 8px 0 4px; }
  .rb-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .rb-box { padding: 10px; border-radius: 14px; background: rgba(0,0,0,.25); font-size: 13px; line-height: 1.5; }
  .rb-box h4 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 15px; }

  /* options */
  .opts { display: grid; gap: 8px; }
  .opt { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.045); }
  .opt label { font-weight: 600; font-size: 14px; }
  .opt .d { font-size: 12px; color: var(--muted); font-weight: 400; display: block; }
  .opt input[type="range"] { width: 140px; accent-color: var(--hot); }
  .opt select { font-family: var(--f-body); font-size: 14px; background: #241450; color: #fff; border: 2px solid var(--stroke); border-radius: 10px; padding: 5px 8px; }
  .switch { position: relative; width: 52px; height: 30px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: #2a1a5a; border: 2px solid var(--stroke); transition: background .2s; }
  .switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.3); transition: transform .2s cubic-bezier(.3,1.6,.5,1); }
  .switch input:checked + span { background: var(--green); }
  .switch input:checked + span::after { transform: translateX(22px); }
  .switch input:focus-visible + span { outline: 3px solid var(--cyan); outline-offset: 2px; }
  .savebox { display: grid; gap: 8px; margin-top: 8px; }
  .savebox textarea { width: 100%; min-height: 70px; resize: vertical; background: #120a2e; color: #d8ccff; border: 2px solid var(--stroke); border-radius: 12px; padding: 8px; font-family: var(--f-mono); font-size: 11px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ───────── overlays ───────── */
  #toasts { position: fixed; z-index: 60; top: calc(var(--top) + 10px); left: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; pointer-events: none; width: min(330px, calc(100% - 32px)); }
  #toasts .toast { font-size: 13px; }
  .toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 16px; background: rgba(18,9,44,.95); border: 3px solid var(--stroke); box-shadow: 0 4px 0 var(--stroke), 0 10px 30px rgba(0,0,0,.4); font-weight: 600; font-size: 14px; animation: toastIn .35s cubic-bezier(.3,1.6,.5,1); max-width: 100%; }
  .toast .e { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 20px; flex: none; background: var(--tc, var(--violet)); border: 2px solid var(--stroke); }
  .toast.out { animation: toastOut .3s ease-in forwards; }
  @keyframes toastIn { from { transform: translateY(-20px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes toastOut { to { transform: translateY(-14px) scale(.9); opacity: 0; } }

  #achpop { position: fixed; z-index: 61; right: calc(var(--pw) + 36px); top: calc(var(--top) + 10px); transform: translateY(-190%); opacity: 0; transition: transform .5s cubic-bezier(.3,1.5,.5,1), opacity .25s; pointer-events: none; }
  #achpop.show { transform: none; opacity: 1; }
  .achcard { display: flex; align-items: center; gap: 12px; padding: 10px 20px 10px 10px; border-radius: 22px; background: linear-gradient(180deg, #ffe066, #ffb800); border: 4px solid var(--stroke); box-shadow: 0 6px 0 var(--stroke), 0 0 40px rgba(255,200,0,.5); color: var(--stroke); min-width: 280px; }
  .achcard .e { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; font-size: 34px; background: #fff7d6; border: 3px solid var(--stroke); animation: spinIn .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes spinIn { from { transform: rotate(-200deg) scale(.2); } to { transform: none; } }
  .achcard .k { font-family: var(--f-display); font-size: 13px; letter-spacing: .08em; opacity: .75; }
  .achcard .n { font-family: var(--f-display); font-size: 21px; line-height: 1.05; }
  .achcard .g { font-family: var(--f-mono); font-weight: 700; font-size: 13px; }

  .modal-back { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: rgba(6,2,18,.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fadeIn .25s; }
  @keyframes fadeIn { from { opacity: 0; } }
  .modal { width: min(440px, 100%); border-radius: 26px; padding: 22px 20px 20px; text-align: center; background: linear-gradient(180deg, #2a1668, #150a38); border: 4px solid var(--stroke); box-shadow: 0 8px 0 var(--stroke), 0 20px 60px rgba(0,0,0,.6); animation: popIn .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes popIn { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h3 { margin: 0 0 8px; font-size: 30px; font-weight: 400; }
  .modal p { margin: 6px 0 16px; color: #e5dcff; line-height: 1.45; }

  /* hatch */
  .hatch { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, rgba(40,20,90,.85), rgba(4,1,12,.95)); overflow: hidden; }
  .hatch .rays { position: absolute; width: 180vmax; height: 180vmax; left: 50%; top: 45%; translate: -50% -50%; background: repeating-conic-gradient(from 0deg, var(--rcol, #fff) 0 8deg, transparent 8deg 22deg); opacity: 0; mask: radial-gradient(circle, #000 0%, transparent 55%); -webkit-mask: radial-gradient(circle, #000 0%, transparent 55%); animation: raysSpin 8s linear infinite; }
  .hatch.reveal .rays { opacity: .35; transition: opacity .4s; }
  @keyframes raysSpin { to { rotate: 360deg; } }
  .hatch .stagebox { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 16px; }
  .hatch .bigegg { width: 150px; height: 190px; border-radius: 50% 50% 50% 50% / 60% 60% 42% 42%; border: 5px solid var(--stroke); box-shadow: inset -14px -18px 0 rgba(0,0,0,.18), inset 12px 14px 0 rgba(255,255,255,.35), 0 20px 40px rgba(0,0,0,.5); animation: eggRumble .12s infinite; }
  @keyframes eggRumble { 0% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-3px); } 100% { transform: rotate(-4deg); } }
  .hatch .bigegg.hard { animation-duration: .06s; }
  .hatch .flashw { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .hatch .flashw.go { animation: flashW .6s ease-out; }
  @keyframes flashW { 0% { opacity: 1; } 100% { opacity: 0; } }
  .hatch .petbig { font-size: 120px; line-height: 1; animation: petIn .7s cubic-bezier(.3,1.7,.5,1); filter: drop-shadow(0 0 30px var(--rg)); }
  @keyframes petIn { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
  .hatch .rar { font-size: 22px; letter-spacing: .1em; }
  .hatch .pname { font-size: 38px; line-height: 1; }
  .hatch .pinfo { color: #e5dcff; font-weight: 600; }

  /* minigame overlay */
  .mg-overlay { position: fixed; inset: 0; z-index: 95; display: flex; flex-direction: column; background: radial-gradient(circle at 50% 0%, #2a1468, var(--bg) 70%); animation: fadeIn .2s; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .mg-head { height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 3px solid var(--stroke); background: rgba(10,5,30,.8); }
  .mg-head .t { font-size: 22px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mg-root { position: relative; flex: 1; overflow: hidden; }

  /* rebirth flash */
  .rbflash { position: fixed; inset: 0; z-index: 99; pointer-events: none; display: grid; place-items: center; background: radial-gradient(circle, #fff 0%, hsl(var(--h) 100% 70%) 30%, transparent 70%); animation: rbf 2.2s ease-out forwards; }
  .rbflash .ol { font-size: clamp(48px, 10vw, 110px); color: var(--gold); animation: popIn .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes rbf { 0% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0; } }

  /* ───────── vector art (no emojis anywhere) ───────── */
  img.ic { width: 1.25em; height: 1.25em; vertical-align: -0.28em; display: inline-block; user-select: none; -webkit-user-drag: none; }
  .tab .e { display: grid; place-items: center; height: 30px; }
  .tab .e img.ic { width: 30px; height: 30px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
  .tab[aria-selected="true"] .e img.ic { animation: tabBob 1.4s ease-in-out infinite; }
  @keyframes tabBob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(-6deg) scale(1.08); } }
  .pill .i { background: none !important; width: 30px; height: 30px; }
  .pill .i img.ic { width: 30px; height: 30px; }
  .iconbtn img.ic { width: 25px; height: 25px; vertical-align: 0; }
  #cps img.ic { width: 1.15em; height: 1.15em; }
  .bakery { font-size: 14px; color: #ffe2b0; letter-spacing: .04em; margin-bottom: -2px; }
  .bakery img.ic { width: 1.35em; height: 1.35em; }
  .brow .ico img.ic, .ucard .ico img.ic { width: 42px; height: 42px; vertical-align: 0; filter: drop-shadow(0 2px 0 rgba(0,0,0,.3)); }
  .ucard .ico img.ic { width: 40px; height: 40px; }
  .brow .cost img.ic, .ucard .c img.ic { width: 1.2em; height: 1.2em; }
  .utile img.ic { width: 32px; height: 32px; vertical-align: 0; }
  .gcard .emo { right: -4px; top: -4px; font-size: 0; }
  .gcard .emo img.ic { width: 78px; height: 78px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
  .mg-head img.mgi { width: 38px; height: 38px; }
  .egg .shape { width: auto; height: auto; border: 0; box-shadow: none; border-radius: 0; background: none; }
  .egg .shape img.ic { width: 66px; height: 66px; display: block; filter: drop-shadow(0 4px 0 rgba(0,0,0,.3)); }
  .slot.full img.ic { width: 54px; height: 54px; }
  .slot .lv, .pet .lv { position: absolute; top: 3px; left: 6px; font-family: var(--f-display); font-size: 11px; color: var(--gold); }
  .slot.full { border-color: var(--rc, rgba(255,255,255,.2)); box-shadow: 0 0 18px var(--rg, transparent) inset; }
  .pet .e img.ic { width: 48px; height: 48px; vertical-align: 0; filter: drop-shadow(0 0 8px var(--rg, transparent)); }
  .skin .p img.ic, .theme .info img.ic { width: 1.15em; height: 1.15em; }
  .theme .tp { font-family: var(--f-mono); font-size: 12px; font-weight: 700; }
  .buff .e img.ic { width: 18px; height: 18px; vertical-align: 0; }
  .quest .e img.ic { width: 36px; height: 36px; vertical-align: 0; }
  .quest .qr { font-family: var(--f-display); font-size: 14px; text-align: center; color: var(--gold); }
  .ach img.ic { width: 28px; height: 28px; vertical-align: 0; }
  .ach.no img.ic { width: 20px; height: 20px; }
  .sub-title img.ic { width: 24px; height: 24px; }
  .toast .e { background: var(--tc, var(--violet)); }
  .toast .e img.ic { width: 26px; height: 26px; vertical-align: 0; }
  .achcard .e img.ic { width: 44px; height: 44px; vertical-align: 0; }
  .banner img.bn { width: 1.3em; height: 1.3em; vertical-align: -0.3em; }
  .rb-hero .big img.xl { width: 1em; height: 1em; vertical-align: -0.12em; }
  .rbflash img.xl { width: .9em; height: .9em; vertical-align: -0.1em; }
  .modal-art { display: grid; place-items: center; margin: -52px auto 4px; }
  .modal-art img.ic { width: 92px; height: 92px; filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)); animation: petIn .7s cubic-bezier(.3,1.7,.5,1); }
  .hatch .bigegg { width: auto; height: auto; border: 0; box-shadow: none; border-radius: 0; background: none !important; }
  .hatch .bigegg img.ic { width: 190px; height: 190px; display: block; filter: drop-shadow(0 20px 30px rgba(0,0,0,.5)); }
  .hatch .petbig img.ic { width: 220px; height: 220px; display: block; filter: drop-shadow(0 0 30px var(--rg)); }
  .hatch .petbig { filter: none; }
  .tip { font-size: 12.5px; margin: 12px 4px 0; }
  .btn img.ic { filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
  .modal .reward { display: block; font-size: 28px; color: var(--gold); margin: 4px 0 2px; }
  #logo img.logo-mark { width: 1.35em; height: 1.35em; align-self: center; margin-right: 2px; animation: spinSlow 8s linear infinite; }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  .iconbtn.gift { position: relative; }
  .iconbtn.gift .gt { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); font-family: var(--f-display); font-size: 10px; white-space: nowrap; padding: 1px 5px; border-radius: 999px; background: var(--panel-solid); border: 2px solid var(--stroke); color: var(--muted); }
  .iconbtn.gift.ready { background: linear-gradient(180deg, #ffe066, #ffb800); animation: giftWiggle 1.2s ease-in-out infinite; box-shadow: 0 0 18px rgba(255,200,0,.7), inset 0 2px 0 rgba(255,255,255,.4), 0 3px 0 var(--stroke); }
  .iconbtn.gift.ready .gt { color: #fff; background: var(--red); }
  @keyframes giftWiggle { 0%,100% { transform: rotate(0); } 10% { transform: rotate(-12deg) scale(1.08); } 20% { transform: rotate(10deg) scale(1.08); } 30% { transform: rotate(0); } }
  input.txt { width: 170px; font-family: var(--f-body); font-size: 14px; background: #241450; color: #fff; border: 2px solid var(--stroke); border-radius: 10px; padding: 6px 8px; }

  function cookie(id, cx, cy, r, sw = 2.6, gloss = true) {
    const k = r / 19.2;

      theme: 'synthwave', themesOwned: { synthwave: true },
      pets: [], equipped: [], petUid: 1,
      achievements: {},
      quests: [], questUid: 1,
      mg: {}, mgSeen: {},
      flags: { logo: 0 },

  CO.state = defaultState();

  /* ═════════════════════════ DERIVED MULTIPLIERS ═════════════════════════ */
  const M = { click: 1, clickCps: 0, bld: {}, cps: 1, crit: 0.03, critX: 10, goldenFreq: 1, goldenDur: 1, comboCap: 3, feverDur: 8, petCps: 1, petClick: 1, star: 1, ach: 1 };
  CO.mult = M;

  function recalc(silent) {
    const s = CO.state;
    M.click = 1; M.clickCps = 0; M.cps = CO.state && CO.state.gameWon ? 2 : 1; M.crit = 0.03; M.critX = 10; M.goldenFreq = 1; M.goldenDur = 1; M.comboCap = 3; M.feverDur = 8;
    D.buildings.forEach((b) => (M.bld[b.id] = 1));
    const vis = {};
    for (const u of D.upgrades) {
      if (!s.upgrades[u.id]) continue;
      const fx = u.fx;
      if (fx.click) M.click *= fx.click;
      if (fx.clickCps) M.clickCps += fx.clickCps;
      if (fx.bld) M.bld[fx.bld] *= fx.x || 1;
      if (fx.cps) M.cps *= fx.cps;
      if (fx.crit) M.crit += fx.crit;
      if (fx.critX) M.critX *= fx.critX;
      if (fx.goldenFreq) M.goldenFreq *= fx.goldenFreq;
      if (fx.goldenDur) M.goldenDur *= fx.goldenDur;
      if (fx.comboCap) M.comboCap += fx.comboCap;
      if (fx.feverDur) M.feverDur *= fx.feverDur;
      if (u.vis) { const [k, l] = u.vis; const max = (D.visuals[k] && D.visuals[k].max) || 1; vis[k] = Math.min(max, (vis[k] || 0) + l); }
    }
    // pets
    let pc = 0, pk = 0;
    for (const p of CO.equippedPets()) {
      const b = p.def.bonus, lv = 1 + 0.5 * (p.lvl - 1);
      if (b.cps) pc += b.cps * lv;
      if (b.click) pk += b.click * lv;
      if (b.all) { pc += b.all * lv; pk += b.all * lv; }
      if (b.crit) M.crit += b.crit;
      if (b.golden) M.goldenFreq *= b.golden;
    }
    M.petCps = 1 + pc; M.petClick = 1 + pk;
    M.star = 1 + 0.1 * s.stars;
    M.ach = 1 + 0.01 * Object.keys(s.achievements).length;
    // visuals diff
    const prev = CO.vis;
    const added = Object.keys(vis).filter((k) => (prev[k] || 0) < vis[k]);
    const removed = Object.keys(prev).some((k) => !vis[k]);
    CO.vis = vis;
    if (!silent && (added.length || removed)) CO.emit('visuals', { vis, added });
  }

  /* ═════════════════════════ ECONOMY ═════════════════════════ */
  const GROWTH = 1.14, BLD_POWER = 1.5; // tuned by simulation: faster, "hyperactive" pacing
  CO.buildingCps = (id) => BLD[id].cps * BLD_POWER * M.bld[id] * M.cps * M.petCps * M.star * M.ach;
  CO.cpsBase = () => {
    let t = 0; const b = CO.state.buildings;
    for (const d of D.buildings) if (b[d.id]) t += d.cps * b[d.id] * M.bld[d.id];
    return t * BLD_POWER * M.cps * M.petCps * M.star * M.ach;
  };
  const buffMul = (key) => CO.buffs.reduce((m, b) => m * (b[key] || 1), 1);
  CO.feverMult = 3;
  CO.cpsNow = () => CO.cpsBase() * buffMul('cps') * (CO.fever.active ? CO.feverMult : 1);
  CO.clickValue = () => {
    const base = M.click + CO.cpsBase() * buffMul('cps') * M.clickCps;

  CO.bCost = (id, n = 1, owned) => {
    const d = BLD[id]; const o = owned != null ? owned : CO.state.buildings[id] || 0;

  };
  CO.bMax = (id) => {
    const d = BLD[id], o = CO.state.buildings[id] || 0;

    if (r.golden != null && s.stats.golden < r.golden) return false;
    if (r.crits != null && s.stats.crits < r.crits) return false;

  }
  CO.reqMet = reqMet;

  /* ═════════════════════════ CLICK / COMBO / FEVER ═════════════════════════ */

    CO.sfx.play('golden');

  };

  CO.boss = null;

  let nextBossAt = null;
  function spawnBoss(forceFinal) {
    const k = CO.state.stats.bossKills, t = CO.now();
    let d, hpMul = 1, dur = 30, kind = 'normal';
    if (forceFinal) { d = D.finalBoss; hpMul = 25; dur = 120; kind = 'final'; }
    else if (k > 0 && (k + 1) % 10 === 0) { d = D.megaBoss; hpMul = 4; dur = 50; kind = 'mega'; }
    else {
      d = pick(D.bosses.filter((b) => (b.minKills || 0) <= k));

    }

      { label: 'Jouer 2 heures', cur: s.stats.playTime, need: 7200, time: true },

  function defeatBoss() {

  /* ═════════════════════════ PETS ═════════════════════════ */
  CO.petDef = (id) => PET[id];
  CO.equippedPets = () => {

  CO.petPower = (p) => { // human-readable bonus
    const b = PET[p.id].bonus, lv = 1 + 0.5 * (p.lvl - 1), out = [];
    if (b.all) out.push('Tout +' + Math.round(b.all * lv * 100) + ' %');
    if (b.cps) out.push('Prod. +' + Math.round(b.cps * lv * 100) + ' %');
    if (b.click) out.push('Clic +' + Math.round(b.click * lv * 100) + ' %');
    if (b.crit) out.push('Crit +' + Math.round(b.crit * 100) + ' %');

  CO.hatch = (eggId) => {
    const egg = EGG[eggId], s = CO.state;
    if (!egg) return null;

    s.gems -= egg.cost;
    const tot = Object.values(egg.odds).reduce((a, b) => a + b, 0);
    let r = Math.random() * tot, rarity = Object.keys(egg.odds)[0];
    for (const [k, w] of Object.entries(egg.odds)) { if ((r -= w) <= 0) { rarity = k; break; } }
    const def = pick(D.pets.filter((p) => p.rarity === rarity));
    let inst = s.pets.find((p) => p.id === def.id), isNew = false;
    if (inst) inst.lvl = Math.min(10, inst.lvl + 1);
    else { inst = { uid: s.petUid++, id: def.id, lvl: 1 }; s.pets.push(inst); isNew = true; }
    if (isNew && s.equipped.length < CO.maxPetSlots) s.equipped.push(inst.uid);
    else if (!isNew) { /* keep */ }
    else autoBestEquip(inst);

  const RANK = { common: 0, rare: 1, epic: 2, legendary: 3, mythic: 4 };
  function autoBestEquip(inst) {
    // replace the weakest equipped pet if the new one outranks it
    const s = CO.state;
    let worst = null;
    for (const uid of s.equipped) { const p = s.pets.find((x) => x.uid === uid); if (!worst || RANK[PET[p.id].rarity] < RANK[PET[worst.id].rarity]) worst = p; }
    if (worst && RANK[PET[inst.id].rarity] > RANK[PET[worst.id].rarity]) s.equipped[s.equipped.indexOf(worst.uid)] = inst.uid;

  CO.toggleEquip = (uid) => {

  function el(tag, cls, html) {

    /* ---- sizing ---- */

    /* ---- launching ---- */

  function el(tag, cls, html) {

  // Fallback milk-glass icon (vector) while CO.art has no 'item:milk'. Centered at 0,0 in a s×s box.

  /* ═════════════════════════ MOUNT ═════════════════════════ */

    const sfxLast = Object.create(null);

    let mode = 'menu';                 // menu | count | play | paused | dying | results
    let resumeRun = false, countT = 0, countStep = -1, goT = 0;
    const bird = { y: 45, vy: 0, rot: 0, flap: 0, alive: true, vis: true };
    let pipes = [], parts = [], texts = [], rings = [], trail = [];
    let dist = 0, speed = 30, pipeIdx = 0, trailAcc = 0;
    let score = 0, items = 0, passed = 0, ended = false, bestAtStart = 0, recAnnounced = false;
    let dieT = 0, crumbled = false, deathKind = 'verre';

    // Title picture: CO.art 'mg:<id>' if available, else the player's own cookie (with accessories).

      const fallback = () => {

    /* ---- DOM ---- */
    const wrap = el('div', P + '-wrap');

    const cv = el('canvas', P + '-cv'); wrap.appendChild(cv);

    const menuEl = el('div', P + '-scr ' + P + '-menu',
      '<div class="' + P + '-top"><div class="' + P + '-emo"></div><h2 class="' + P + '-title stroke-text"></h2>' +
      '<div class="' + P + '-sub">Fais voler ton cookie entre les verres de lait</div></div>' +
      '<div class="' + P + '-bot"><div class="' + P + '-rules"></div><div class="' + P + '-best"></div>' +

    const titleSpans = letters(menuEl.querySelector('.' + P + '-title'), 'FLAPPY COOKIE');
    const rulesEl = menuEl.querySelector('.' + P + '-rules');
    [['ui:tap', 'Tape / Espace = battre des ailes'], ['item:milk', 'Touche pas les verres de lait', paintMilk], ['ui:gem', 'Pépites et gemmes = +1 bonus'], ['ui:fire', 'Tous les 10 = AURA +10']]
      .forEach((r) => iconText(rulesEl, r[0], r[1], P + '-rule', r[2]));
    iconText(menuEl.querySelector('.' + P + '-best'), 'ui:trophy', 'RECORD : ' + fmt(bestNow()));
    const playBtn = menuEl.querySelector('.' + P + '-play');

    const resEl = el('div', P + '-scr ' + P + '-res',

      '<div class="' + P + '-lbl">SCORE</div><div class="' + P + '-score stroke-text">0</div>' +
      '<div class="' + P + '-rec stroke-text" hidden></div><div class="' + P + '-bestl"></div>' +
      '<div class="' + P + '-stats"></div><div class="' + P + '-rw" hidden></div>' +
      '<div class="' + P + '-btns ' + P + '-wait"><button class="btn green ' + P + '-again" type="button">REJOUER</button>' +

    /* ---- sizing + pre-rendered parallax layers ---- */

    /* ---- world ---- */
    function makePipe(x, prevGy, first) {
      const gap = gapFor(diff());

      let gy = first ? rand(38, 52) : rand(lo, hi);

    }
    function ensurePipes() {

    function resetWorld(popIn) {

      for (let i = 0; i < n && parts.length < lim; i++) {
        parts.push({ x, y, vx: rand(-280, 280), vy: rand(-560, -120), g: 1300, life: rand(0.35, 0.75), age: 0, sz: rand(2.5, 6.5), col: cols[i % cols.length], rot: rand(0, 6), vr: rand(-12, 12), sh: 0 });
      }
      const ns = Math.round((perfect ? 10 : 5) * b);
      for (let i = 0; i < ns && parts.length < lim; i++) {
        const a = rand(-Math.PI, 0), sp = rand(250, 620);
        parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 300, life: rand(0.2, 0.45), age: 0, sz: rand(2, 3.5), col: colOf(lane), rot: 0, vr: 0, sh: 1 });
      }
      rings.push({ x, y, age: 0, life: perfect ? 0.4 : 0.3, r0: G.nr * 0.9, col: colOf(lane), w: perfect ? 6 : 4 });
    }
    function confetti(n) {
      const lim = maxParts(); n = Math.round(n * budget());
      for (let i = 0; i < n && parts.length < lim; i++) {
        parts.push({ x: rand(0, W), y: rand(-60, -10), vx: rand(-60, 60), vy: rand(80, 260), g: 120, life: rand(2, 3.5), age: 0, sz: rand(4, 8), col: hsl(rand(0, 360), 100, 62), rot: rand(0, 6), vr: rand(-8, 8), sh: 2 });
      }
    }
    function banner(text, col, big, icon) { banners.push({ text, col, age: 0, big: !!big, icon }); if (banners.length > 3) banners.shift(); }
    function doFlash(a, col) { if (S().reducedMotion) return; flash = Math.max(flash, a); flashCol = col || '#fff'; }

    /* ── judgement ── */
    function onHit(n, perfect, early) {
      n.j = perfect ? 1 : 2; n.jt = songT;
      combo++; if (combo > maxCombo) maxCombo = combo;
      score += Math.round((perfect ? 300 : 100) * mult(combo));
      if (perfect) nP++; else nG++;
      hype = Math.min(1, hype + (perfect ? 0.022 : 0.011));
      judge = { text: perfect ? 'PERFECT' : 'GOOD', perfect, early, age: 0 };
      flashL[n.lane] = 1; comboPop = 1;
      burst(laneX(n.lane, G.hitY), G.hitY, n.lane, perfect);
      if (synth) synth.crunch(n.lane, perfect);
      else api.sfx(perfect ? 'perfect' : 'good', { vol: 0.35, pitch: 1 + n.lane * 0.06 });
      if (combo % 25 === 0) {
        banner(`COMBO ×${combo}`, '#ffc93c', true, 'ui:fire');
        if (mult(combo) > mult(combo - 1)) banner(`MULTI ×${String(mult(combo)).replace('.', ',')}`, '#b6ff3b', false, 'ui:bolt');
        api.sfx('combo', { vol: 0.6, pitch: 1 + Math.min(combo, 150) / 300 });
        if (canShake()) shake = Math.max(shake, 7);
        doFlash(0.18, '#fff');
      }
      if (combo === 50) { rgbMode = true; banner('MODE RGB ACTIVÉ', 'rgb', true, 'ui:sparkle'); doFlash(0.35, '#fff'); confetti(40); }
      if (hype >= 1 && !hypeMaxShown) { hypeMaxShown = true; banner('HYPE MAX', 'rgb', false, 'ui:fire'); }
    }
    function onMiss(n) {
      n.j = -1; n.jt = songT; nM++;
      if (combo >= 10) banner('COMBO BREAK', '#ff4d6d');
      combo = 0; rgbMode = false;
      hype = Math.max(0, hype - 0.15); if (hype < 0.9) hypeMaxShown = false;
      judge = { text: 'MISS', miss: true, age: 0 };
      missL[n.lane] = 1;
      if (canShake()) shake = Math.max(shake, 5);
      api.sfx('miss', { vol: 0.45 });
    }
    function pressLane(lane, evStamp) {
      held[lane] = true; press[lane] = 1;
      if (mode !== 'play') return;
      const lag = clamp((performance.now() - (evStamp || performance.now())) / 1000, 0, 0.1);
      const t = songNow() - lag - INPUT_OFFSET;
      let best = null, bd = 1e9;
      for (let i = first; i < notes.length; i++) {
        const n = notes[i];
        if (n.t - t > WIN_EARLY) break;
        if (n.j || n.lane !== lane) continue;
        const d = Math.abs(n.t - t);
        if (d < bd) { bd = d; best = n; }
      }
      if (!best || bd > WIN_EARLY) return; // ghost tap: no penalty
      if (bd <= WIN_P) onHit(best, true, best.t > t);
      else if (bd <= WIN_G) onHit(best, false, best.t > t);
      else onMiss(best);
    }
    function releaseLane(lane) { held[lane] = false; }

    /* ── flow ── */
    function clearLayer() { layer.innerHTML = ''; heroCv = null; titleLs = []; nbLs = []; scoreEl = null; }
    function showStart() {
      mode = 'start'; clearLayer();
      const p = el('div', 'cor-panel');
      const best = api.best() || 0;
      p.innerHTML = `
        <div class="cor-title stroke-text">${letters('CRUNCH')}<br>${letters('RYTHME')}</div>
        <div class="cor-sub">Croque les cookies en rythme. Full combo ou rien.</div>
        <canvas class="cor-hero"></canvas>
        ${coarse ? '' : '<div class="cor-keys"><kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd></div>'}
        <div class="cor-how">${coarse ? 'Tape les <b>4 colonnes</b>' : 'Appuie (ou <b>← ↓ ↑ →</b>, ou clique)'} quand le cookie touche la ligne. <b>PERFECT</b> = ±45 ms. Enchaîne pour le <b>multi ×4</b> et le mode RGB.</div>
        <div class="cor-best">${ico('ui:trophy', 'trophy')} RECORD : ${best ? fmtInt(best) : '—'}</div>
        <button class="btn big green cor-go" type="button">JOUER ${ico('ui:play', 'play')}</button>
        <div class="cor-tip">Mets le son, la prod est une dinguerie</div>`;
      hydrateArt(p);
      layer.appendChild(p);
      heroCv = p.querySelector('.cor-hero');
      titleLs = [...p.querySelectorAll('.cor-title .l')];
      titleLs.forEach((s, i) => { s.style.animationDelay = `${-i * 0.08}s`; });
      p.querySelector('.cor-go').addEventListener('click', startRun);
    }
    function startRun() {
      if (!alive) return;
      clearLayer();
      api.sfx('click', { vol: 0.6 });
      notes = CHART.map((n) => ({ t: n.t, lane: n.lane, step: n.step, chord: n.chord, j: 0, jt: 0 }));
      first = 0; score = 0; combo = 0; maxCombo = 0; nP = 0; nG = 0; nM = 0; hype = 0; hypeMaxShown = false; rgbMode = false;
      judge = null; banners.length = 0; lastCount = 99; res = null;
      killAudio();
      const lead = 0.35 + COUNT_IN * SPB;
      audioMode = false;
      let a = null;
      try { a = api.audio && api.audio(); } catch (e) { a = null; }
      if (a && a.ctx && a.out) {
        try {
          synth = createSynth(a);
          t0 = a.ctx.currentTime + lead; nextStep = 0; clk.init = false; audioMode = true;
          for (let k = 0; k < COUNT_IN; k++) synth.blip(t0 - (COUNT_IN - k) * SPB, k === COUNT_IN - 1);
          schedule();
          schedTimer = setInterval(schedule, 30);
        } catch (e) { killAudio(); audioMode = false; }
      }
      perfT0 = performance.now() / 1000 + lead;
      waitSince = performance.now();
      songT = -lead;
      mode = 'play';
    }
    function finish() {
      mode = 'results';
      if (schedTimer) { clearInterval(schedTimer); schedTimer = 0; }
      const total = notes.length;
      const acc = total ? (nP + nG * 0.5) / total : 0;
      const rank = acc >= 0.95 ? 'S' : acc >= 0.85 ? 'A' : acc >= 0.7 ? 'B' : acc >= 0.5 ? 'C' : 'D';
      const cookies = Math.round(api.unit() * 6 * acc * acc);
      const gems = rank === 'S' ? 6 : rank === 'A' ? 3 : rank === 'B' ? 1 : 0;
      let r = null;
      try { r = api.end({ score, cookies, gems }); } catch (e) { r = null; }
      r = r || { cookies, gems, isNewBest: false };
      res = { acc, rank, score, r, t: performance.now() / 1000, lastTick: 0 };
      showResults();
    }
    function showResults() {
      clearLayer();
      const { acc, rank, r } = res;
      const msgs = { S: 'T\'es un robot ou quoi ?? Aura infinie.', A: 'Propre. Grosse aura.', B: 'Pas mal du tout, continue !', C: 'Mid… mais on y croit.', D: 'Skill issue (tkt, rejoue).' };
      const rc = { S: '#ffc93c', A: '#b6ff3b', B: '#1ff4ff', C: '#8a5cff', D: '#ff4d6d' }[rank];
      const p = el('div', 'cor-panel');
      const chips = [];
      if (r.cookies > 0) chips.push(`<span class="cor-chip">+${api.fmt(r.cookies)} ${ico('ui:cookie', 'cookie')}</span>`);
      if (r.gems > 0) chips.push(`<span class="cor-chip gem" style="animation-delay:.15s">+${api.fmt(r.gems)} ${ico('ui:gem', 'gem')}</span>`);
      if (!chips.length) chips.push(`<span class="cor-chip none">+0 ${ico('ui:cookie', 'cookie')} (ratio)</span>`);
      p.innerHTML = `
        <div class="cor-rank" style="color:${rc};text-shadow:0 .06em 0 #1a0b33,0 0 34px ${rc}">${rank}</div>
        <div class="cor-rmsg">${msgs[rank]}</div>
        ${r.isNewBest ? `<div class="cor-nb stroke-text">${letters('NOUVEAU RECORD !')}</div>` : ''}
        <div class="cor-score"><span>SCORE</span><b class="stroke-text">0</b></div>
        ${nM === 0 ? `<div class="cor-fc stroke-text">${ico('ui:fire', 'fire')} FULL COMBO ${ico('ui:fire', 'fire')}</div>` : ''}
        <div class="cor-grid">
          <div><span>PRÉCISION</span><b>${(acc * 100).toFixed(1).replace('.', ',')} %</b></div>
          <div><span>COMBO MAX</span><b>${maxCombo}</b></div>
          <div><span>NOTES</span><b>${nP + nG}/${notes.length}</b></div>
          <div class="p"><span>PERFECT</span><b>${nP}</b></div>
          <div class="g"><span>GOOD</span><b>${nG}</b></div>
          <div class="m"><span>MISS</span><b>${nM}</b></div>
        </div>
        <div class="cor-rew">${chips.join('')}</div>
        <div class="cor-btns"><button class="btn green cor-again" type="button">REJOUER</button><button class="btn dark cor-quit" type="button">QUITTER</button></div>`;
      hydrateArt(p);
      layer.appendChild(p);
      scoreEl = p.querySelector('.cor-score b');
      nbLs = [...p.querySelectorAll('.cor-nb .l')];
      p.querySelector('.cor-again').addEventListener('click', startRun);
      p.querySelector('.cor-quit').addEventListener('click', () => api.close());
      if (rank === 'S' || rank === 'A') { confetti(rank === 'S' ? 140 : 70); doFlash(0.3, '#fff'); }
      api.sfx(['S', 'A', 'B'].includes(rank) ? 'win' : 'lose', { vol: 0.8 });
      if (r.isNewBest) api.sfx('achievement', { vol: 0.8 });
    }

    /* ── input ── */
    function onPointerDown(e) {
      if (mode !== 'play') return;
      e.preventDefault();
      const r = cv.getBoundingClientRect();
      const lane = laneFromXY(e.clientX - r.left, e.clientY - r.top);
      ptrLane.set(e.pointerId, lane);
      pressLane(lane, e.timeStamp);
    }
    function onPointerUp(e) {
      const l = ptrLane.get(e.pointerId);
      if (l != null) { ptrLane.delete(e.pointerId); if (![...ptrLane.values()].includes(l)) releaseLane(l); }
    }
    function onKeyDown(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const lane = KEYMAP[e.code];
      if (lane != null) {
        e.preventDefault();
        if (!e.repeat) pressLane(lane, e.timeStamp);
        return;
      }
      if (e.code === 'Enter' || e.code === 'Space') {
        if (mode === 'start' || (mode === 'results' && res && performance.now() / 1000 - res.t > 0.8)) { e.preventDefault(); if (!e.repeat) startRun(); }
        else if (mode === 'play') e.preventDefault();
      }
    }
    function onKeyUp(e) { const lane = KEYMAP[e.code]; if (lane != null) releaseLane(lane); }
    function onBlur() { for (let i = 0; i < 4; i++) held[i] = false; ptrLane.clear(); }
    function onVis() {
      // tab hidden mid-song: rAF stops but audio would keep going → abort the run cleanly
      if (document.hidden && mode === 'play') { killAudio(); api.toast('Partie annulée : t\'as quitté l\'onglet', { icon: 'ui:warning', color: '#ff4d6d' }); showStart(); }
    }
    cv.addEventListener('pointerdown', onPointerDown);
    cv.addEventListener('pointerup', onPointerUp);
    cv.addEventListener('pointercancel', onPointerUp);
    cv.addEventListener('pointerleave', onPointerUp);
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', onBlur);
    document.addEventListener('visibilitychange', onVis);

    /* ── update ── */
    function update(dt, T) {
      const rm = !!S().reducedMotion;
      wrap.classList.toggle('cor-rm', rm);
      if (mode === 'play') {
        songT = songNow();
        if (audioMode && synth && synth.ctx.state !== 'running' && performance.now() - waitSince > 1200 && songT < 0) {
          // audio never started (autoplay policy…) → silent performance clock
          const keep = songT; killAudio(); audioMode = false; perfT0 = performance.now() / 1000 - keep;
        }
        if (songT < 0) {
          const b = Math.floor(songT / SPB);
          if (b !== lastCount && b >= -COUNT_IN) { lastCount = b; if (!audioMode) api.sfx('tick', { pitch: b === -1 ? 1.5 : 1 }); if (b === -1) doFlash(0.25, '#fff'); }
        }
        while (first < notes.length && notes[first].j) first++;
        for (let i = first; i < notes.length; i++) {
          const n = notes[i];
          if (n.t > songT) break;
          if (!n.j && songT - n.t > WIN_G) onMiss(n);
        }
        if (first >= notes.length && songT > LAST_T + 1.1) finish();
        hype = Math.max(0, hype - dt * 0.02);
      } else {
        // attract mode: loop the drop silently with an autoplay bot
        const dT = DEMO_A + ((T - demo0) % DEMO_LEN);
        const prev = demoPrev; demoPrev = dT;
        for (const n of CHART) {
          if (n.t < DEMO_A || n.t >= DEMO_A + DEMO_LEN) continue;
          const crossed = dT >= prev ? n.t > prev && n.t <= dT : n.t > prev || n.t <= dT;
          if (crossed) { flashL[n.lane] = 1; press[n.lane] = 1; if (mode === 'start') burst(laneX(n.lane, G.hitY), G.hitY, n.lane, true); }
        }
        songT = dT;
      }
      for (let i = 0; i < 4; i++) {
        press[i] = held[i] ? 1 : Math.max(0, press[i] - dt * 7);
        flashL[i] = Math.max(0, flashL[i] - dt * 4);
        missL[i] = Math.max(0, missL[i] - dt * 3);
      }
      comboPop = Math.max(0, comboPop - dt * 5);
      shake = Math.max(0, shake - dt * 30);
      flash = Math.max(0, flash - dt * 2.5);
      if (judge) { judge.age += dt; if (judge.age > 0.6) judge = null; }
      for (let i = banners.length - 1; i >= 0; i--) { banners[i].age += dt; if (banners[i].age > 1.3) banners.splice(i, 1); }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.age += dt;
        if (p.age >= p.life) { parts.splice(i, 1); continue; }
        p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      }
      for (let i = rings.length - 1; i >= 0; i--) { rings[i].age += dt; if (rings[i].age >= rings[i].life) rings.splice(i, 1); }
      // DOM bits
      titleLs.forEach((s, i) => { s.style.color = hsl(api.hue(i * 28), 100, 64); });
      nbLs.forEach((s, i) => { s.style.color = hsl(api.hue(i * 24), 100, 64); });
      if (res && scoreEl) {
        const k = clamp((T - res.t - 0.2) / 1.1, 0, 1);
        const shown = Math.round(res.score * (1 - Math.pow(1 - k, 3)));
        scoreEl.textContent = fmtInt(shown);
        if (k < 1 && T - res.lastTick > 0.07) { res.lastTick = T; api.sfx('tick', { vol: 0.35, pitch: 0.8 + k }); }
        if (res.rank === 'S' && Math.random() < dt * 6) confetti(4);
      }
    }

    /* ── render ── */
    function drawBg(T, vt, pulse, rm) {
      const h = api.hue(0);
      const hor = H * 0.4;
      let g = ctx.createLinearGradient(0, 0, 0, H);
      if (rgbMode) {
        g.addColorStop(0, hsl(h, 85, 10)); g.addColorStop(0.4, hsl((h + 50) % 360, 95, 32)); g.addColorStop(0.42, hsl((h + 180) % 360, 90, 12)); g.addColorStop(1, hsl((h + 120) % 360, 90, 16));
      } else {
        g.addColorStop(0, '#0b0620'); g.addColorStop(0.3, '#240a45'); g.addColorStop(0.4, '#6a1668'); g.addColorStop(0.405, '#14062b'); g.addColorStop(1, '#0d0421');
      }
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // sun
      const sr = Math.min(W, H) * 0.2 * (1 + (rm ? 0 : pulse * 0.05));
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, hor); ctx.clip();
      const sg = ctx.createLinearGradient(0, hor - sr, 0, hor + sr * 0.2);
      if (rgbMode) { sg.addColorStop(0, hsl((h + 60) % 360, 100, 65)); sg.addColorStop(1, hsl((h + 300) % 360, 100, 55)); } else { sg.addColorStop(0, '#ffe66b'); sg.addColorStop(0.55, '#ff7a59'); sg.addColorStop(1, '#ff2bd6'); }
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(W / 2, hor, sr, Math.PI, 0); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = rgbMode ? hsl(h, 85, 12) : '#2a0b4a';
      for (let i = 0; i < 6; i++) { const yy = hor - sr * 0.08 - i * sr * 0.14; ctx.fillRect(W / 2 - sr, yy, sr * 2, Math.max(1.5, sr * 0.035 * (6 - i) * 0.5)); }
      ctx.restore();
      // floor grid
      ctx.save();
      ctx.beginPath(); ctx.rect(0, hor, W, H - hor); ctx.clip();
      const lines = 12, ph = rm ? 0 : ((vt / SPB) % 1 + 1) % 1;
      ctx.lineWidth = 1.5;
      for (let k = 0; k < lines; k++) {
        const z = (k + ph) / lines;
        const y = hor + (H - hor) * z * z;
        ctx.strokeStyle = rgbMode ? hsl((h + k * 25) % 360, 100, 60, 0.25 + z * 0.5) : `rgba(255,43,214,${0.18 + z * 0.55})`;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      for (let k = -10; k <= 10; k++) {
        ctx.strokeStyle = rgbMode ? hsl((h + k * 18 + 360) % 360, 100, 60, 0.45) : 'rgba(31,244,255,.28)';
        ctx.beginPath(); ctx.moveTo(W / 2 + k * W * 0.03, hor); ctx.lineTo(W / 2 + k * W * 0.24, H); ctx.stroke();
      }
      ctx.restore();
      // hype lasers
      if (hype > 0.6 && mode === 'play' && !rm) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const a = (hype - 0.6) / 0.4;
        for (let i = 0; i < 4; i++) {
          const ang = Math.sin(T * 1.3 + i * 1.7) * 0.6 - Math.PI / 2;
          const x0 = i < 2 ? 0 : W, y0 = H;
          ctx.strokeStyle = hsl(api.hue(i * 90), 100, 60, 0.18 * a);
          ctx.lineWidth = 10;
          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + Math.cos(ang + (i < 2 ? 0.5 : -0.5)) * H * 1.5, y0 + Math.sin(ang) * H * 1.5); ctx.stroke();
        }
        ctx.restore();
      }
      if (!rm && pulse > 0 && mode === 'play' && songT >= 0) { ctx.fillStyle = `rgba(255,255,255,${pulse * (rgbMode ? 0.07 : 0.035)})`; ctx.fillRect(0, 0, W, H); }
    }

    function drawHighway(vt, T) {
      const kT = kAt(0), kB = kAt(H);
      const half = G.hw / 2;
      ctx.beginPath();
      ctx.moveTo(G.cx - half * kT, 0); ctx.lineTo(G.cx + half * kT, 0); ctx.lineTo(G.cx + half * kB, H); ctx.lineTo(G.cx - half * kB, H); ctx.closePath();
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, 'rgba(8,3,26,.25)'); g.addColorStop(0.6, 'rgba(10,4,32,.78)'); g.addColorStop(1, 'rgba(8,3,24,.9)');
      ctx.fillStyle = g; ctx.fill();
      // lane beams
      for (let l = 0; l < 4; l++) {
        const a = Math.max(flashL[l] * 0.55, press[l] * 0.3, missL[l] * 0.5);
        if (a <= 0.01) continue;
        const x0t = G.cx + (l * G.lw - half) * kT, x1t = G.cx + ((l + 1) * G.lw - half) * kT;
        const yb = G.hitY, kb = kAt(yb);
        const x0b = G.cx + (l * G.lw - half) * kb, x1b = G.cx + ((l + 1) * G.lw - half) * kb;
        const lg = ctx.createLinearGradient(0, 0, 0, yb);
        const col = missL[l] > flashL[l] ? '#ff4d6d' : colOf(l);
        lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(1, col);
        ctx.globalAlpha = a; ctx.fillStyle = lg;
        ctx.beginPath(); ctx.moveTo(x0t, 0); ctx.lineTo(x1t, 0); ctx.lineTo(x1b, yb); ctx.lineTo(x0b, yb); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
      }
      // beat lines
      const b0 = Math.floor(vt / SPB), b1 = b0 + Math.ceil(APPROACH / SPB) + 2;
      for (let b = b0; b <= b1; b++) {
        const y = G.hitY - (b * SPB - vt) * G.speed;
        if (y < 0 || y > G.hitY) continue;
        const k = kAt(y);
        ctx.strokeStyle = b % 4 === 0 ? 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.07)';
        ctx.lineWidth = b % 4 === 0 ? 2 : 1;
        ctx.beginPath(); ctx.moveTo(G.cx - half * k, y); ctx.lineTo(G.cx + half * k, y); ctx.stroke();
      }
      // dividers
      ctx.lineWidth = 1.5;
      for (let i = 1; i < 4; i++) {
        ctx.strokeStyle = 'rgba(190,150,255,.18)';
        ctx.beginPath(); ctx.moveTo(G.cx + (i * G.lw - half) * kT, 0); ctx.lineTo(G.cx + (i * G.lw - half) * kB, H); ctx.stroke();
      }
      // RGB rails
      for (const side of [-1, 1]) {
        const x0 = G.cx + side * half * kT, x1 = G.cx + side * half * kB;
        const rg = ctx.createLinearGradient(0, 0, 0, H);
        for (let i = 0; i <= 4; i++) rg.addColorStop(i / 4, hsl(api.hue(i * 60 + (side > 0 ? 180 : 0)), 100, 62));
        ctx.strokeStyle = rg;
        ctx.globalAlpha = 0.3; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x1, H); ctx.stroke();
        ctx.globalAlpha = 1; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x1, H); ctx.stroke();
      }
      // hit line
      const kh = kAt(G.hitY);
      const hx0 = G.cx - half * kh, hx1 = G.cx + half * kh;
      ctx.strokeStyle = rainbow(ctx, hx0, hx1, api.hue(0));
      ctx.globalAlpha = 0.35; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(hx0, G.hitY); ctx.lineTo(hx1, G.hitY); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(hx0, G.hitY); ctx.lineTo(hx1, G.hitY); ctx.stroke();
    }

    function drawNoteSet(list, vt, from, offset, demo) {
      // chord bars first
      const yOf = (n) => G.hitY - (n.t + offset - vt) * G.speed;
      for (let i = from; i < list.length - 1; i++) {
        const a = list[i], b = list[i + 1];
        const y = yOf(a);
        if (y < -G.nr * 2) break;
        if (!a.chord || b.step !== a.step) continue;
        if (!demo && (a.j || b.j)) continue;
        if (demo && (a.t + offset <= vt || a.t < DEMO_A || a.t >= DEMO_A + DEMO_LEN)) continue;
        if (y > G.hitY + G.nr) continue;
        const k = kAt(y);
        ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 7 * k; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(laneX(a.lane, y), y); ctx.lineTo(laneX(b.lane, y), y); ctx.stroke();
        ctx.strokeStyle = hsl(api.hue(0), 100, 65); ctx.lineWidth = 3 * k;
        ctx.beginPath(); ctx.moveTo(laneX(a.lane, y), y); ctx.lineTo(laneX(b.lane, y), y); ctx.stroke();
      }
      for (let i = from; i < list.length; i++) {
        const n = list[i];
        const y = yOf(n);
        if (y < -G.nr * 2) break;
        let alpha = 1;
        if (demo) { if (n.t + offset <= vt || n.t < DEMO_A || n.t >= DEMO_A + DEMO_LEN) continue; }
        else if (n.j > 0) continue;
        else if (n.j < 0) { alpha = 1 - (vt - n.jt) / 0.35; if (alpha <= 0) continue; }
        if (y > H + G.nr * 2) continue;
        const k = kAt(y), x = laneX(n.lane, y), r = G.nr * k;
        const col = n.j < 0 ? '#ff4d6d' : colOf(n.lane);
        ctx.globalAlpha = alpha;
        const gg = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 1.7);
        gg.addColorStop(0, col); gg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = gg; ctx.globalAlpha = alpha * 0.55;
        ctx.beginPath(); ctx.arc(x, y, r * 1.7, 0, Math.PI * 2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = alpha;
        ctx.strokeStyle = INK; ctx.lineWidth = 5 * k;
        ctx.beginPath(); ctx.arc(x, y, r * 1.02, 0, Math.PI * 2); ctx.stroke();
        api.drawCookie(ctx, x, y, r, { rot: vt * 2.2 + n.lane * 1.3 + n.step, simple: true });
        ctx.strokeStyle = col; ctx.lineWidth = 2.5 * k;
        ctx.beginPath(); ctx.arc(x, y, r * 1.1, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    function drawReceptors(T, beatPh) {
      for (let l = 0; l < 4; l++) {
        const x = laneX(l, G.hitY), y = G.hitY, k = kAt(y);
        const col = colOf(l);
        const r = G.nr * k * (1.08 - press[l] * 0.1 + (S().reducedMotion ? 0 : Math.pow(1 - beatPh, 4) * 0.06));
        if (flashL[l] > 0 || press[l] > 0) {
          const a = Math.max(flashL[l], press[l] * 0.6);
          ctx.globalCompositeOperation = 'lighter';
          const gg = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 2.4);
          gg.addColorStop(0, col); gg.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.globalAlpha = a * 0.7; ctx.fillStyle = gg;
          ctx.beginPath(); ctx.arc(x, y, r * 2.4, 0, Math.PI * 2); ctx.fill();
          ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
        }
        ctx.fillStyle = press[l] > 0.05 ? col : 'rgba(10,4,30,.75)';
        ctx.globalAlpha = press[l] > 0.05 ? 0.35 + press[l] * 0.3 : 1;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
        ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.stroke();
        ctx.lineWidth = 1.5; ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
        if (!coarse) otext(ctx, KEY_LABEL[l], x, y + 1, Math.round(r * 0.62), '#fff', 'center', 0.22);
      }
    }

    function drawParticles() {
      for (const p of parts) {
        const a = 1 - p.age / p.life;
        ctx.globalAlpha = Math.min(1, a * 1.6);
        ctx.fillStyle = p.col;
        if (p.sh === 1) {
          ctx.strokeStyle = p.col; ctx.lineWidth = p.sz; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
        } else {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          if (p.sh === 2) ctx.fillRect(-p.sz / 2, -p.sz * 0.3, p.sz, p.sz * 0.6 * Math.abs(Math.cos(p.rot * 2)) + 1);
          else ctx.fillRect(-p.sz / 2, -p.sz / 2, p.sz, p.sz);
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
      for (const r of rings) {
        const k = r.age / r.life;
        ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.col; ctx.lineWidth = r.w * (1 - k) + 1;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 * (1 + k * 1.3), 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function drawCombo(T) {
      if (combo < 3 || mode !== 'play') return;
      const y = G.hitY * 0.42;
      const sz = Math.min(W * 0.2, 78) * (1 + comboPop * 0.3) * (1 + Math.min(combo, 200) / 800);
      let dx = 0, dy = 0;
      if (comboPop > 0.2 && canShake() && combo % 25 === 0) { dx = rand(-4, 4); dy = rand(-4, 4); }
      ctx.globalAlpha = 0.9;
      const fill = combo >= 50 ? rainbow(ctx, G.cx - sz, G.cx + sz, api.hue(0)) : '#fff';
      otext(ctx, String(combo), G.cx + dx, y + dy, Math.round(sz), fill, 'center', 0.16);
      otext(ctx, 'COMBO', G.cx, y + sz * 0.62, Math.round(sz * 0.3), combo >= 25 ? '#ffc93c' : '#b3a6dd', 'center', 0.22);
      ctx.globalAlpha = 1;
    }

    function drawJudge() {
      if (!judge) return;
      const a = judge.age;
      const y = G.hitY - Math.min(150, G.hitY * 0.28) - (judge.miss ? -a * 40 : a * 20);
      const pop = a < 0.1 ? 0.5 + easeOutBack(a / 0.1) * 0.7 : 1.2 - Math.min(0.2, (a - 0.1) * 0.8);
      const sz = Math.round(Math.min(W * 0.12, 46) * pop);
      ctx.globalAlpha = a > 0.4 ? Math.max(0, 1 - (a - 0.4) / 0.2) : 1;
      if (judge.miss) otext(ctx, 'MISS', G.cx, y, sz, '#ff4d6d');
      else if (judge.perfect) otext(ctx, 'PERFECT', G.cx, y, sz, rainbow(ctx, G.cx - sz * 2.2, G.cx + sz * 2.2, api.hue(0) + a * 600));
      else {
        otext(ctx, 'GOOD', G.cx, y, sz, '#1ff4ff');
        otext(ctx, judge.early ? 'TÔT' : 'TARD', G.cx, y + sz * 0.72, Math.round(sz * 0.36), '#b3a6dd');
      }
      ctx.globalAlpha = 1;
    }

    function drawBanners() {
      let yy = H * 0.24;
      for (const b of banners) {
        const a = b.age;
        const s = a < 0.15 ? 0.3 + easeOutBack(a / 0.15) * 0.7 : 1;
        const sz = Math.round(Math.min(W * (b.big ? 0.085 : 0.065), b.big ? 40 : 30) * s);
        ctx.globalAlpha = a > 1 ? Math.max(0, 1 - (a - 1) / 0.3) : 1;
        const fill = b.col === 'rgb' ? rainbow(ctx, G.cx - W * 0.35, G.cx + W * 0.35, api.hue(0) + a * 300) : b.col;
        otext(ctx, b.text, G.cx, yy - a * 18, sz, fill);
        if (b.icon) {
          ctx.font = `${sz}px ${FD}`;
          const tw = ctx.measureText(b.text).width;
          artDraw(ctx, b.icon, G.cx - tw / 2 - sz * 0.75, yy - a * 18, sz * 1.15, { rot: Math.sin(a * 12) * 0.15 });
          artDraw(ctx, b.icon, G.cx + tw / 2 + sz * 0.75, yy - a * 18, sz * 1.15, { rot: -Math.sin(a * 12) * 0.15 });
        }
        yy += sz * 1.25;
      }
      ctx.globalAlpha = 1;
    }

    function drawHUD(T, vt, beatPh) {
      // top shade
      const hg = ctx.createLinearGradient(0, 0, 0, 92);
      hg.addColorStop(0, 'rgba(8,3,24,.85)'); hg.addColorStop(1, 'rgba(8,3,24,0)');
      ctx.fillStyle = hg; ctx.fillRect(0, 0, W, 92);
      // progress
      const prog = clamp(vt / SONG_LEN, 0, 1);
      ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(0, 0, W, 4);
      ctx.fillStyle = rainbow(ctx, 0, W, api.hue(0)); ctx.fillRect(0, 0, W * prog, 4);
      const pad = 12;
      ctx.font = `700 11px ${FM}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#b3a6dd';
      ctx.fillText('SCORE', pad, 22);
      otext(ctx, fmtInt(score), pad, 40, 24, '#fff', 'left', 0.2);
      const m = mult(combo);
      ctx.font = `700 11px ${FM}`; ctx.textAlign = 'right'; ctx.fillStyle = '#b3a6dd';
      ctx.fillText('MULTI', W - pad, 22);
      otext(ctx, `×${String(m).replace('.', ',')}`, W - pad, 40, 24, m >= 4 ? rainbow(ctx, W - 80, W, api.hue(0)) : m > 1 ? '#ffc93c' : '#fff', 'right', 0.2);
      // hero cookie dancing on the beat (on wide screens it dances on the side instead)
      if (!sideRoom()) {
        const bounce = S().reducedMotion ? 0 : Math.pow(1 - beatPh, 3);
        const hr = clamp(W * 0.055, 18, 28) * (1 + (rgbMode ? 0.15 : 0));
        api.drawCookie(ctx, W / 2, 34 - bounce * 5, hr, { accessories: true, rot: Math.sin(T * (rgbMode ? 9 : 4)) * (rgbMode ? 0.35 : 0.12), squash: bounce * 0.3 });
      }
      // hype bar
      const bw = Math.min(W - pad * 2, G.hw + 60), bx = (W - bw) / 2, by = 64, bh = 11;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
      rrect(bx, by, bw, bh, 6); ctx.fill(); ctx.stroke();
      if (hype > 0.002) {
        ctx.save(); rrect(bx, by, bw * hype, bh, 6); ctx.clip();
        ctx.fillStyle = rainbow(ctx, bx, bx + bw, api.hue(0) + T * 90);
        ctx.fillRect(bx, by, bw * hype, bh);
        ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(bx, by, bw * hype, bh * 0.4);
        ctx.restore();
      }
      ctx.font = `700 9px ${FM}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
      ctx.fillText(hype >= 1 ? 'HYPE MAX' : 'HYPE', bx + 6, by + bh / 2 + 0.5);
    }
    function rrect(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }

    function sideRoom() { return (W - G.hw * kAt(G.hitY)) / 2 >= 160; }
    function drawSides(T, vt, beatPh) {
      if (!sideRoom()) return;
      const rm = !!S().reducedMotion;
      const side = (W - G.hw * kAt(G.hitY)) / 2;
      const pulse = rm ? 0 : Math.pow(1 - beatPh, 3);
      const beatN = Math.floor(vt / SPB);
      const hype2 = mode === 'play' ? Math.min(1, combo / 60) : 0.5;
      // left: the player's cookie dancing to the track
      const R = clamp(side * 0.27, 46, 118);
      const x = side * 0.5, y = H * 0.56;
      const lean = rm ? 0 : (beatN % 2 ? 1 : -1) * (0.12 + hype2 * 0.25) * (1 - beatPh * 0.6);
      const gg = ctx.createRadialGradient(x, y, R * 0.4, x, y, R * 2.2);
      gg.addColorStop(0, hsl(api.hue(0), 100, 60, 0.35 + pulse * 0.2)); gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x, y, R * 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(x, y + R * 1.12, R * (0.85 - pulse * 0.15), R * 0.16, 0, 0, Math.PI * 2); ctx.fill();
      api.drawCookie(ctx, x, y - pulse * R * (0.18 + hype2 * 0.2), R, { accessories: true, rot: lean, squash: pulse * 0.3 });
      if (!rm) for (let i = 0; i < 2; i++) {
        const k = (T * 0.7 + i * 0.5) % 1;
        ctx.globalAlpha = Math.sin(k * Math.PI) * 0.9;
        noteGlyph(ctx, x + (i ? 1 : -1) * R * 1.05, y - R * 0.4 - k * R * 1.2, R * 0.34, hsl(api.hue(i * 150), 100, 65), Math.sin(T * 3 + i) * 0.3);
      }
      ctx.globalAlpha = 1;
      // right: RGB equaliser pumping on the beat
      const n = 9, ex0 = W - side * 0.88, ew = side * 0.76, bw = ew / n;
      const baseY = H * 0.74, maxH = H * 0.42;
      for (let i = 0; i < n; i++) {
        const wob = 0.5 + 0.5 * Math.sin(i * 1.9 + vt * 7.3) * Math.cos(i * 0.7 - vt * 3.1);
        const hgt = maxH * (0.12 + (0.35 + hype2 * 0.4) * wob * (0.45 + pulse * 0.55)) * (mode === 'play' ? 1 : 0.6);
        const segs = Math.max(1, Math.floor(hgt / 12));
        for (let j = 0; j < segs; j++) {
          ctx.fillStyle = hsl((api.hue(i * 22) + j * 8) % 360, 100, 60, 0.35 + 0.6 * (j / segs));
          ctx.fillRect(ex0 + i * bw + 2, baseY - (j + 1) * 12 + 2, bw - 4, 9);
        }
      }
    }

    function drawCountdown(vt) {
      if (mode !== 'play' || vt >= 0) return;
      const b = Math.floor(vt / SPB);
      const cy = H * 0.42;
      if (b < -COUNT_IN) { otext(ctx, 'PRÊT ?', G.cx, cy, Math.round(Math.min(W * 0.14, 60)), '#fff'); return; }
      const ph = vt / SPB - b;
      const label = ['3', '2', '1', 'GO !'][b + COUNT_IN];
      const go = b === -1;
      const sz = Math.round(Math.min(W, H) * (go ? 0.2 : 0.28) * (1.35 - 0.35 * Math.min(1, ph * 3)));
      ctx.globalAlpha = 1 - ph * 0.5;
      otext(ctx, label, G.cx, cy, sz, go ? rainbow(ctx, G.cx - sz * 1.3, G.cx + sz * 1.3, api.hue(0)) : ['#ff4d6d', '#ffc93c', '#b6ff3b'][b + COUNT_IN], 'center', 0.14);
      ctx.globalAlpha = 1;
    }

    function drawHero(T) {
      if (!heroCv) return;
      const w = heroCv.clientWidth, h = heroCv.clientHeight;
      if (!w || !h) return;
      const pw = Math.round(w * DPR), ph = Math.round(h * DPR);
      if (heroCv.width !== pw || heroCv.height !== ph) { heroCv.width = pw; heroCv.height = ph; }
      const c = heroCv.getContext('2d');
      c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, w, h);
      const rm = S().reducedMotion;
      const bp = ((T / SPB) % 1);
      const bounce = rm ? 0 : Math.pow(1 - bp, 2.5);
      const R = Math.min(w, h) * 0.34;
      const gg = c.createRadialGradient(w / 2, h / 2, R * 0.4, w / 2, h / 2, R * 1.45);
      gg.addColorStop(0, hsl(api.hue(0), 100, 60, 0.55)); gg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = gg; c.fillRect(0, 0, w, h);
      c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(w / 2, h * 0.9, R * (0.8 - bounce * 0.15), R * 0.14, 0, 0, Math.PI * 2); c.fill();
      api.drawCookie(c, w / 2, h * 0.5 - bounce * R * 0.16, R, { accessories: true, rot: rm ? 0 : Math.sin(T * 2.4) * 0.2, squash: bounce * 0.25 });
      // music notes floating
      if (!rm) {
        for (let i = 0; i < 3; i++) {
          const k = (T * 0.6 + i / 3) % 1;
          c.globalAlpha = Math.sin(k * Math.PI);
          noteGlyph(c, w / 2 + (i - 1) * R * 1.15 + Math.sin(T * 3 + i) * 5, h * 0.62 - k * h * 0.5, R * 0.42, hsl(api.hue(i * 120), 100, 65), Math.sin(T * 4 + i) * 0.25);
        }
        c.globalAlpha = 1;
      }
    }

    function render(T, dt) {
      const rm = !!S().reducedMotion;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const vt = songT;
      const beatPh = ((vt / SPB) % 1 + 1) % 1;
      const pulse = Math.pow(1 - beatPh, 3);
      drawBg(T, vt, pulse, rm);
      drawSides(T, vt, beatPh);
      ctx.save();
      if (shake > 0 && canShake()) ctx.translate(rand(-shake, shake), rand(-shake, shake));
      drawHighway(vt, T);
      drawCombo(T);
      if (mode === 'play') {
        let from = first;
        while (from > 0 && notes[from - 1].t > vt - 0.5) from--;
        drawNoteSet(notes, vt, from, 0, false);
      } else {
        drawNoteSet(CHART, vt, 0, 0, true);
        if (vt + APPROACH > DEMO_A + DEMO_LEN) drawNoteSet(CHART, vt, 0, DEMO_LEN, true);
      }
      drawReceptors(T, beatPh);
      if (mode !== 'play') { ctx.fillStyle = 'rgba(11,6,32,.42)'; ctx.fillRect(-20, -20, W + 40, H + 40); }
      drawParticles();
      drawJudge();
      drawBanners();
      ctx.restore();
      if (mode === 'play') { drawHUD(T, vt, beatPh); drawCountdown(vt); }
      if (flash > 0) { ctx.globalAlpha = flash; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
      drawHero(T);
    }

    /* ── loop ── */
    let raf = 0, last = performance.now();
    function frame(now) {
      if (!alive) return;
      raf = requestAnimationFrame(frame);
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
      const T = performance.now() / 1000;
      update(dt, T);
      render(T, dt);
    }
    showStart();
    raf = requestAnimationFrame(frame);

    return {
      // read-only snapshot for harness bots / debugging
      debug: () => ({ mode, songT, audioMode, notes, score, combo, maxCombo, nP, nG, nM, hype, parts: parts.length }),
      destroy() {
        if (!alive) return;
        alive = false;
        cancelAnimationFrame(raf);
        killAudio();
        ro.disconnect();
        window.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('keyup', onKeyUp);
        window.removeEventListener('blur', onBlur);
        document.removeEventListener('visibilitychange', onVis);
        layer.innerHTML = '';
        wrap.remove();
        parts.length = 0; rings.length = 0; banners.length = 0;
      },
    };
  }
})();

</script>
<script>
/* ── js/mg-slots.js ── */
/* COOKIE OVERDRIVE — mg-slots.js : « Casino Crumble » (id: slots)
 * Neon 3-reel slot machine. Outcome table tuned for an expected return of ~0.945 × bet per spin
 * (see _sim on the definition: pickOutcome + evaluate are pure and verified by simulation).
 * No emoji anywhere: symbols come from CO.art (art.js) with hand-drawn vector fallbacks.
 */
(function () {
  'use strict';
  const CO = window.CO;
  if (!CO || typeof CO.registerMinigame !== 'function') return;

  const FD = '"Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif';
  const FM = '"Chakra Petch", ui-monospace, Menlo, monospace';
  const INK = '#1a0b33';
  const TAU = Math.PI * 2;

  /* ───────────────────────── math model ───────────────────────── */
  const SYMS = ['cookie', 'seven', 'gem', 'choco', 'milk', 'donut', 'cupcake', 'broc'];
  const ART = { seven: 'item:seven', gem: 'ui:gem', choco: 'item:choco', milk: 'item:milk', donut: 'item:donut', cupcake: 'item:cupcake', broc: 'item:broccoli' };
  // Probability of each outcome class per spin (payout × bet, stake included).
  const OUTCOMES = [
    { kind: 'jackpot', p: 0.0065 },  // 7 7 7        ×25
    { kind: 'cookie3', p: 0.013 },   // cookie ×3    ×10
    { kind: 'gem3', p: 0.016 },      // gem ×3       ×5 + 15 gems
    { kind: 'triple', p: 0.042 },    // other ×3     ×4
    { kind: 'pair', p: 0.27 },       // any 2 (not broccoli) ×1.5
    { kind: 'broc3', p: 0.02 },      // SKILL ISSUE  ×0
    { kind: 'lose', p: 1 },          // remainder
  ];
  const PAIR_W = { cookie: 2, seven: 1.2, gem: 1.6, choco: 4, milk: 4, donut: 4, cupcake: 4 };
  const ODD_W = { cookie: 3, seven: 2, gem: 2.5, choco: 4, milk: 4, donut: 4, cupcake: 4, broc: 4 };

    const freeBtn = bottom.querySelector('.cos-free'), spinBtn = bottom.querySelector('.cos-spin');
    // free spin button label: long version when there is room
    if (root.clientWidth >= 400) { freeBtn.innerHTML = `TOUR GRATUIT ${ico('ui:gift', 'gift')}`; hydrateArt(freeBtn); }

    /* ── state ── */
    let W = 320, H = 480, DPR = 1;
    const M = { x: 0, y: 0, w: 0, h: 0, cs: 80, pad: 10, gap: 8, headH: 50, winH: 150, meterH: 40, reelY: 0, meterY: 0, lever: false, lx: 0, ly: 0, bulbs: [] };
    let betPct = 0.1, freeLeft = 1;
    let spinning = false, lockUntil = 0, curBet = 0, curFree = false, result = null, outcome = null, resolved = true;
    let spins = 0, bestMult = 0, streak = 0, forced = null;
    let anticip = false, anticipT = 0, tickT = 0;
    let meter = { from: 0, to: 0, t0: 0, dur: 1, label: 'BONNE CHANCE', kind: 'idle', lastTick: 0 };
    let fx = { rays: 0, raysCol: 'rgb', tint: 0, tintCol: '#2bdc6a', flash: 0, flashCol: '#fff', shake: 0, big: null, hero: 0, fountain: 0, fountainKind: 'coin', droop: 0, bounce: 0, hitGlow: 0, deny: 0 };
    const parts = [], rings = [];
    let leverPull = 0, leverT = -9;
    let lastBank = -1, bankBumpT = 0;
    const live = new Map(); // own WebAudio sources
    let riserStop = null;

    const reels = [0, 1, 2].map(() => {
      const strip = [];
      for (let i = 0; i < 64; i++) strip.push(SYMS[Math.floor(Math.random() * SYMS.length)]);
      return { strip, off: Math.floor(Math.random() * 64), v: 0, state: 'idle', stopAt: 0, from: 0, F: 0, t0: 0, dur: 0.5, target: 'cookie', land: 0 };
    });
    const symAt = (r, idx) => r.strip[((idx % 64) + 64) % 64];

    /* ── symbol sprites (CO.art sprite → CO.art.draw → vector fallback), cached per pixel size ── */
    const cache = new Map();
    function symSprite(sym, px) {
      const key = sym + ':' + px;
      const now = performance.now();
      const e = cache.get(key);
      if (e && (e.art || now - e.t < 1000)) return e.cv;
      const A = CO.art;
      if (A && typeof A.sprite === 'function') {
        let sp = null; try { sp = A.sprite(ART[sym], px); } catch (err) { sp = null; }
        if (sp) { cache.set(key, { cv: sp, art: true, t: now }); return sp; }
      }
      const c2 = (e && !e.art && e.cv) || document.createElement('canvas');
      c2.width = px; c2.height = px;
      const g = c2.getContext('2d');
      g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, px, px);
      let art = false;
      if (artDraw(g, ART[sym], px / 2, px / 2, px)) art = true;
      else { g.translate(px / 2, px / 2); FB[sym](g, px); }
      cache.set(key, { cv: c2, art, t: now });
      return c2;
    }
    function drawSym(c, sym, x, y, size, blur) {
      if (sym === 'cookie') {
        if (blur > 0.05) {
          c.globalAlpha = 0.3; api.drawCookie(c, x, y - blur * size * 0.3, size * 0.38, { simple: true }); api.drawCookie(c, x, y + blur * size * 0.3, size * 0.38, { simple: true });
          c.globalAlpha = 1;
        }
        api.drawCookie(c, x, y, size * 0.38, { simple: true, rot: 0 });
        return;
      }
      const px = Math.max(16, Math.round(size * DPR));
      const sp = symSprite(sym, px);
      if (blur > 0.05) {
        const st = 1 + blur * 0.35;
        c.globalAlpha = 0.28; c.drawImage(sp, x - size / 2, y - size * st / 2 - blur * size * 0.32, size, size * st);
        c.drawImage(sp, x - size / 2, y - size * st / 2 + blur * size * 0.32, size, size * st);
        c.globalAlpha = 0.9; c.drawImage(sp, x - size / 2, y - size * st / 2, size, size * st);
        c.globalAlpha = 1;
      } else c.drawImage(sp, x - size / 2, y - size / 2, size, size);
    }

    /* ── own audio (anticipation riser, sad trombone, fanfare) ── */
    function audio() { try { return api.audio(); } catch (e) { return null; } }
    function reg(src, chain) { live.set(src, chain); src.onended = () => { live.delete(src); chain.forEach((n) => { try { n.disconnect(); } catch (e) { /* */ } }); }; }
    function voice(type, f0, f1, t, dur, vol, a) {
      const o = a.ctx.createOscillator(), g = a.ctx.createGain(), f = a.ctx.createBiquadFilter();
      o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      f.type = 'lowpass'; f.frequency.value = 2400;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.setValueAtTime(vol, t + dur * 0.8); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(f); f.connect(g); g.connect(a.out); o.start(t); o.stop(t + dur + 0.02); reg(o, [o, f, g]);
      return o;
    }
    function startRiser(dur) {
      const a = audio(); if (!a) return null;
      const t = a.ctx.currentTime;
      const o = a.ctx.createOscillator(), g = a.ctx.createGain(), lfo = a.ctx.createOscillator(), lg = a.ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(1100, t + dur);
      lfo.frequency.value = 9; lg.gain.value = 0.05; lfo.connect(lg); lg.connect(g.gain);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + dur * 0.9);
      o.connect(g); g.connect(a.out); o.start(t); lfo.start(t); o.stop(t + dur + 0.3); lfo.stop(t + dur + 0.3);
      reg(o, [o, g]); reg(lfo, [lfo, lg]);
      return () => { try { const n = a.ctx.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(0.06, n); g.gain.exponentialRampToValueAtTime(0.001, n + 0.08); o.stop(n + 0.1); lfo.stop(n + 0.1); } catch (e) { /* */ } };
    }
    function sadTrombone() {
      const a = audio(); if (!a) return;
      const t = a.ctx.currentTime + 0.05;
      [[293.7, 0.32], [277.2, 0.32], [261.6, 0.32]].forEach(([f, d], i) => voice('sawtooth', f, f * 0.985, t + i * 0.34, d, 0.12, a));
      const o = voice('sawtooth', 246.9, 233, t + 1.02, 1.1, 0.13, a);
      const lfo = a.ctx.createOscillator(), lg = a.ctx.createGain();
      lfo.frequency.value = 6; lg.gain.value = 5; lfo.connect(lg); lg.connect(o.frequency);
      lfo.start(t + 1.1); lfo.stop(t + 2.15); reg(lfo, [lfo, lg]);
    }
    function fanfare() {
      const a = audio(); if (!a) return;
      const t = a.ctx.currentTime + 0.02;
      [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => voice('square', f, 0, t + i * 0.085, i === 7 ? 0.6 : 0.12, 0.07, a));
    }
    function killAudio() {
      live.forEach((chain, src) => { src.onended = null; try { src.stop(0); } catch (e) { /* */ } chain.forEach((n) => { try { n.disconnect(); } catch (e) { /* */ } }); });
      live.clear(); riserStop = null;
    }

    /* ── layout ── */
    function resize() {
      const r = root.getBoundingClientRect();
      W = Math.max(240, r.width || root.clientWidth || 320); H = Math.max(300, r.height || root.clientHeight || 480);
      DPR = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
      wrap.classList.toggle('cos-short', H < 520 && W > H);
      const topH = top.offsetHeight + 4, botH = bottom.offsetHeight + 4;
      const areaT = topH, areaH = Math.max(160, H - botH - topH);
      M.lever = W >= 520;
      const maxW = Math.min(W - 16 - (M.lever ? 90 : 0), 600);
      const cs = clamp(Math.min(maxW / 3.5, (areaH - 18) / 3.62), 40, 150);
      M.cs = cs; M.pad = cs * 0.15; M.gap = cs * 0.1;
      M.headH = cs * 0.66; M.winH = cs * 1.95; M.meterH = cs * 0.5;
      M.w = cs * 3 + M.gap * 2 + M.pad * 2;
      M.h = M.pad * 2 + M.headH + M.pad * 0.6 + M.winH + M.pad * 0.6 + M.meterH;
      M.x = (W - M.w) / 2 - (M.lever ? 26 : 0);
      M.y = areaT + (areaH - M.h) / 2;
      M.reelY = M.y + M.pad + M.headH + M.pad * 0.6;
      M.meterY = M.reelY + M.winH + M.pad * 0.6;
      M.lx = M.x + M.w + cs * 0.26; M.ly = M.reelY + M.winH * 0.55;
      // bulbs around the frame
      M.bulbs = [];
      const inset = cs * 0.075, x0 = M.x + inset, y0 = M.y + inset, x1 = M.x + M.w - inset, y1 = M.y + M.h - inset;
      const step = clamp(cs * 0.24, 14, 30);
      const edge = (ax, ay, bx, by) => { const L = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.round(L / step)); for (let i = 0; i < n; i++) M.bulbs.push([ax + (bx - ax) * (i / n), ay + (by - ay) * (i / n)]); };
      edge(x0, y0, x1, y0); edge(x1, y0, x1, y1); edge(x1, y1, x0, y1); edge(x0, y1, x0, y0);
