<meta charset="utf-8"><!-- dev only: stripped by build.py -->

<title>Cookie Overdrive</title>
<meta name="description" content="Cookie clicker RGB hyperactif : upgrades qui transforment le cookie, pets, boss, mini-jeux.">
<meta name="theme-color" content="#14062b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<style>
  /* ───────── app shell ───────── */
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    --top: calc(64px + env(safe-area-inset-top, 0px));
    --pw: clamp(360px, 33vw, 470px);
    --acc: hsl(var(--h) 100% 62%);
    --acc2: hsl(calc(var(--h) + 70) 100% 62%);
    --acc3: hsl(calc(var(--h) + 180) 100% 62%);
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; color: inherit; }
  ::selection { background: var(--hot); color: #fff; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: manipulation; }

  .ol { /* chunky outline for display text */
    font-family: var(--f-display); color: #fff; letter-spacing: .02em;
    text-shadow: 2px 0 0 var(--stroke), -2px 0 0 var(--stroke), 0 2px 0 var(--stroke), 0 -2px 0 var(--stroke),
      2px 2px 0 var(--stroke), -2px 2px 0 var(--stroke), 2px -2px 0 var(--stroke), -2px -2px 0 var(--stroke), 0 4px 0 var(--stroke);
  }
  .ol-lg { text-shadow: 3px 0 0 var(--stroke), -3px 0 0 var(--stroke), 0 3px 0 var(--stroke), 0 -3px 0 var(--stroke),
      3px 3px 0 var(--stroke), -3px 3px 0 var(--stroke), 3px -3px 0 var(--stroke), -3px -3px 0 var(--stroke), 0 6px 0 var(--stroke), 0 10px 22px rgba(0,0,0,.45); }

  /* ───────── top bar ───────── */
  #topbar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 20; height: var(--top);
    padding: env(safe-area-inset-top, 0px) 14px 0; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, rgba(8,4,24,.92) 0%, rgba(8,4,24,.55) 70%, rgba(8,4,24,0) 100%);
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  #logo { display: flex; align-items: baseline; gap: 6px; font-size: 27px; line-height: 1; cursor: pointer; user-select: none; white-space: nowrap; background: none; border: 0; padding: 0; }
  #logo .a { transform: rotate(-3deg); display: inline-block; }
  #logo .b { color: var(--acc); display: inline-block; transform: rotate(2deg) translateY(2px); }
  #logo:active { transform: scale(.94); }
  .pills { display: flex; gap: 8px; margin-left: auto; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px 0 6px; border-radius: 999px;
    background: rgba(20,10,48,.85); border: 3px solid var(--stroke); box-shadow: inset 0 2px 0 rgba(255,255,255,.12), 0 3px 0 var(--stroke);
    font-family: var(--f-display); font-size: 18px; white-space: nowrap;
  }
  .pill .i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; background: rgba(255,255,255,.08); }
  .pill.gem .i { background: radial-gradient(circle at 35% 30%, #9bfff0, #1fc8b0 60%, #0a7a70); }
  .pill.star .i { background: radial-gradient(circle at 35% 30%, #fff3a8, #ffc93c 60%, #c07a00); }
  .pill.bump { animation: bump .35s cubic-bezier(.3,1.8,.5,1); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
  .iconbtn {
    width: 42px; height: 42px; border-radius: 14px; border: 3px solid var(--stroke); cursor: pointer; font-size: 19px;
    background: linear-gradient(180deg, #3a2a70, #251652); box-shadow: inset 0 2px 0 rgba(255,255,255,.18), inset 0 -3px 0 #170d38, 0 3px 0 var(--stroke);
    display: grid; place-items: center; transition: transform .08s;
  }
  .iconbtn:active { transform: translateY(2px); }
  .iconbtn.on { background: linear-gradient(180deg, var(--acc), hsl(calc(var(--h) + 30) 90% 45%)); }
  .iconbtn:focus-visible, .tab:focus-visible, .brow:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }

  /* ───────── play zone (DOM HUD over the canvas) ───────── */
  #play { position: fixed; left: 0; top: var(--top); bottom: 0; right: calc(var(--pw) + 22px); z-index: 5; pointer-events: none; }
  #hud { position: absolute; left: 0; right: 0; top: 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  #count { font-size: clamp(36px, 5.2vw, 62px); line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #count .u { font-size: .42em; margin-left: .2em; color: #ffe2b0; }
  #count.pulse { animation: cpulse .18s ease-out; }
  @keyframes cpulse { 0% { transform: scale(1.06); } 100% { transform: scale(1); } }
  #cps { font-family: var(--f-mono); font-weight: 700; font-size: 15px; color: #fff; padding: 3px 12px; border-radius: 999px; background: rgba(10,5,30,.55); border: 2px solid rgba(255,255,255,.08); letter-spacing: .03em; }
  #cps b { color: var(--lime); }
  #cps.boost b { color: var(--acc); }
  #combo { width: min(320px, 80%); display: grid; gap: 3px; transition: opacity .3s; }
  #combo.idle { opacity: .0; }
  #combo .lbl { display: flex; justify-content: space-between; font-family: var(--f-display); font-size: 15px; }
  #combo .lbl .m { color: var(--acc); }
  #combo .bar { height: 12px; border-radius: 999px; background: rgba(10,5,30,.7); border: 2px solid var(--stroke); overflow: hidden; box-shadow: 0 2px 0 var(--stroke); }
  #combo .fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, hsl(var(--h) 100% 60%), hsl(calc(var(--h) + 60) 100% 60%), hsl(calc(var(--h) + 120) 100% 60%)); transition: width .12s; }
  #combo.hot .fill { box-shadow: 0 0 14px hsl(var(--h) 100% 60%); }
  #buffs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 0; }
  .buff { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 999px; font-family: var(--f-display); font-size: 14px; background: rgba(10,5,30,.8); border: 2px solid var(--stroke); position: relative; overflow: hidden; }
  .buff .e { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.1); }
  .buff .t { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
  .buff .drain { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--acc); }

  #banners { position: absolute; left: 0; right: 0; bottom: 44px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .banner { font-size: clamp(20px, 2.6vw, 30px); padding: 4px 18px 6px; border-radius: 16px; background: rgba(10,5,30,.7); border: 3px solid var(--stroke); white-space: nowrap; animation: bannerIn .4s cubic-bezier(.3,1.7,.5,1); }
  .banner small { font-family: var(--f-mono); font-size: .55em; color: var(--muted); margin-left: 8px; }
  .banner.fever { color: var(--acc); animation: bannerIn .4s cubic-bezier(.3,1.7,.5,1), wiggle .25s infinite; }
  .banner.boss { color: #ff8a9c; }
  @keyframes bannerIn { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes wiggle { 0%,100% { rotate: -1.5deg; } 50% { rotate: 1.5deg; } }

  #hint { position: absolute; left: 50%; top: 0; transform: translateX(-50%); font-size: 22px; text-align: center; white-space: nowrap; animation: hintBob 1s ease-in-out infinite; transition: opacity .4s; }
  #hint img.hand { display: block; width: 46px; height: 46px; margin: 0 auto 2px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
  @keyframes hintBob { 0%,100% { translate: 0 0; } 50% { translate: 0 -10px; } }
  #hint.gone { opacity: 0; }

  #ticker { position: absolute; left: 14px; right: 14px; bottom: 8px; height: 30px; border-radius: 999px; overflow: hidden; background: rgba(8,4,24,.72); border: 2px solid rgba(255,255,255,.08); display: flex; align-items: center; }
  #ticker .tag { flex: none; height: 100%; display: grid; place-items: center; padding: 0 12px; font-family: var(--f-display); font-size: 13px; background: var(--red); color: #fff; letter-spacing: .06em; }
  #ticker .track { flex: 1; overflow: hidden; white-space: nowrap; position: relative; height: 100%; -webkit-mask: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); mask: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
  #ticker .msg { position: absolute; top: 50%; transform: translateY(-50%); left: 100%; font-size: 14px; font-weight: 500; color: #e9e0ff; will-change: transform; }

  /* ───────── side panel ───────── */
  #panel {
    position: fixed; right: 12px; top: calc(var(--top) + 2px); bottom: 12px; width: var(--pw); z-index: 10;
    display: flex; flex-direction: column; border-radius: 26px; overflow: hidden;
    background: linear-gradient(180deg, rgba(26,13,61,.9), rgba(14,7,36,.92));
    -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
    border: 3px solid var(--stroke); box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .rgb-edge { position: relative; }
  .rgb-edge::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 3px; pointer-events: none;
    background: conic-gradient(from calc(var(--h) * 1deg), #ff004c, #ff8a00, #ffe600, #2bff88, #00d5ff, #7a5cff, #ff2bd6, #ff004c);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .9;
  }
  #tabs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 10px 10px 8px; background: rgba(0,0,0,.18); border-bottom: 2px solid rgba(255,255,255,.06); flex: none; }
  .tab {
    position: relative; border: 0; background: transparent; cursor: pointer; border-radius: 14px; padding: 6px 0 5px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s, transform .1s;
  }
  .tab .e { font-size: 22px; line-height: 1.1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.4)); transition: transform .2s cubic-bezier(.3,1.8,.5,1); }
  .tab:hover { background: rgba(255,255,255,.06); color: #fff; }
  .tab:hover .e { transform: scale(1.15) rotate(-6deg); }
  .tab[aria-selected="true"] { color: #fff; background: linear-gradient(180deg, hsl(var(--h) 90% 55% / .55), hsl(calc(var(--h) + 40) 90% 40% / .35)); box-shadow: inset 0 0 0 2px hsl(var(--h) 100% 70% / .7); }
  .tab .badge { position: absolute; top: 0; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--red); color: #fff; font-family: var(--f-display); font-size: 11px; display: grid; place-items: center; border: 2px solid var(--stroke); animation: bump .5s; }
  .tab .badge[hidden] { display: none; }
  #tab-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 12px 18px; scrollbar-width: thin; scrollbar-color: #4a3590 transparent; }
  #tab-body::-webkit-scrollbar { width: 8px; }
  #tab-body::-webkit-scrollbar-thumb { background: #4a3590; border-radius: 8px; }
  .sheet-handle { display: none; }

  .sec-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 2px 10px; }
  .sec-title h2 { margin: 0; font-size: 24px; font-weight: 400; }
  .sec-title .note { font-size: 12.5px; color: var(--muted); }
  .sub-title { font-family: var(--f-display); font-size: 17px; margin: 16px 2px 8px; color: #e8dcff; display: flex; align-items: center; gap: 8px; }
  .sub-title .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); }
  .empty { padding: 18px; text-align: center; color: var(--muted); border: 2px dashed rgba(255,255,255,.12); border-radius: 16px; font-size: 14px; }

  /* segmented control */
  .seg { display: inline-flex; background: rgba(0,0,0,.35); border: 2px solid var(--stroke); border-radius: 12px; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: transparent; cursor: pointer; font-family: var(--f-display); font-size: 14px; padding: 5px 10px; border-radius: 9px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--acc); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.4); }

  /* building rows */
  .blist { display: grid; gap: 8px; }
  .brow {
    position: relative; display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 9px 12px 11px 9px;
    border-radius: 18px; background: rgba(255,255,255,.045); border: 2px solid rgba(255,255,255,.07); cursor: pointer; overflow: hidden;
    transition: transform .1s, border-color .2s, background .2s; user-select: none; text-align: left; width: 100%;
  }
  .brow:hover { transform: translateX(-3px); background: rgba(255,255,255,.07); }
  .brow:active { transform: scale(.98); }
  .brow.can { border-color: hsl(var(--h) 100% 65% / .75); background: linear-gradient(90deg, rgba(43,220,106,.16), rgba(255,255,255,.04) 70%); }
  .brow.locked { cursor: default; opacity: .55; filter: grayscale(.8); }
  .brow.locked:hover { transform: none; }
  .brow .ico { width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center; font-size: 30px; background: radial-gradient(circle at 30% 25%, #4a3690, #1d0f45 70%); border: 3px solid var(--stroke); box-shadow: inset 0 -4px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.15); }
  .brow.can .ico { animation: icoPulse 1.6s ease-in-out infinite; }
  @keyframes icoPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06) rotate(-3deg); } }
  .brow .nm { font-family: var(--f-display); font-size: 17px; line-height: 1.1; }
  .brow .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .brow .cost { font-family: var(--f-mono); font-weight: 700; font-size: 14px; margin-top: 3px; color: #ff8a9c; }
  .brow.can .cost { color: var(--lime); }
  .brow .own { font-family: var(--f-display); font-size: 30px; min-width: 40px; text-align: right; color: rgba(255,255,255,.9); }
  .brow .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--acc), var(--acc2)); transition: width .25s; }
  .brow .qty { position: absolute; top: 6px; right: 10px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
  .flash { animation: flash .45s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 hsl(var(--h) 100% 65% / .9), inset 0 0 30px hsl(var(--h) 100% 70% / .6); } 100% { box-shadow: 0 0 0 16px transparent, inset 0 0 0 transparent; } }

  /* upgrade cards */
  .ulist { display: grid; gap: 8px; }
  .ucard { display: grid; grid-template-columns: 50px 1fr; gap: 10px; align-items: center; padding: 10px; border-radius: 18px; background: rgba(255,255,255,.045); border: 2px solid rgba(255,255,255,.07); position: relative; }
  .ucard.can { border-color: hsl(var(--h) 100% 65% / .75); }
  .ucard .ico { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; font-size: 28px; background: radial-gradient(circle at 30% 25%, #5a3fb0, #1d0f45 70%); border: 3px solid var(--stroke); }
  .ucard.can .ico { background: radial-gradient(circle at 30% 25%, hsl(var(--h) 90% 60%), #1d0f45 75%); }
  .ucard .nm { font-family: var(--f-display); font-size: 16.5px; line-height: 1.15; }
  .ucard .fx { font-size: 12.5px; color: #e0d6ff; margin-top: 2px; }
  .ucard .vis { font-size: 12.5px; color: var(--lime); margin-top: 2px; font-weight: 600; }
  .ucard .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; grid-column: 1 / -1; }
  .ucard .row .c { font-family: var(--f-mono); font-weight: 700; font-size: 14px; color: #ff8a9c; }
  .ucard.can .row .c { color: var(--lime); }
  .ucard.locked { opacity: .6; }
  .ucard.locked .ico { filter: grayscale(1) brightness(.6); }
  .ucard .req { font-size: 12.5px; color: var(--gold); }
  .utiles { display: flex; flex-wrap: wrap; gap: 6px; }
  .utile { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: radial-gradient(circle at 30% 25%, #4a3690, #1d0f45 70%); border: 2px solid var(--stroke); cursor: help; }

  /* games */
  .ggrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gcard { position: relative; overflow: hidden; border-radius: 20px; padding: 26px 12px 12px; min-height: 176px; display: flex; flex-direction: column; gap: 6px; border: 3px solid var(--stroke); box-shadow: 0 4px 0 var(--stroke); background: linear-gradient(150deg, var(--gc) -10%, #1d0f45 62%); }
  .gcard .emo { position: absolute; right: -6px; top: -8px; font-size: 64px; transform: rotate(14deg); filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); opacity: .95; transition: transform .3s cubic-bezier(.3,1.8,.5,1); }
  .gcard:hover .emo { transform: rotate(-4deg) scale(1.12); }
  .gcard .nm { font-size: 20px; line-height: 1.05; max-width: 75%; position: relative; }
  .gcard .tg { font-size: 12.5px; color: #eee6ff; line-height: 1.3; position: relative; }
  .gcard .best { font-family: var(--f-mono); font-size: 12px; color: var(--gold); margin-top: auto; }
  .gcard .btn { align-self: stretch; }
  .gcard.locked { filter: grayscale(.9); }
  .gcard.locked .lock { font-size: 12.5px; color: #fff; }
  .gcard .new { position: absolute; left: 10px; top: -2px; }
  .ribbon { font-family: var(--f-display); font-size: 12px; padding: 3px 8px; border-radius: 0 0 10px 10px; background: var(--red); border: 2px solid var(--stroke); border-top: 0; }
  .mprog { height: 8px; border-radius: 999px; background: rgba(0,0,0,.4); overflow: hidden; border: 2px solid var(--stroke); }
  .mprog > i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc), var(--acc2)); }

  /* pets */
  .eggs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .egg { border-radius: 18px; padding: 10px 8px; background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.08); display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .egg .shape { width: 54px; height: 68px; border-radius: 50% 50% 50% 50% / 60% 60% 42% 42%; border: 3px solid var(--stroke); position: relative; box-shadow: inset -6px -8px 0 rgba(0,0,0,.18), inset 5px 6px 0 rgba(255,255,255,.35); animation: eggIdle 2.4s ease-in-out infinite; }
  .egg:hover .shape { animation: eggShake .5s ease-in-out infinite; }
  @keyframes eggIdle { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(3deg); } }
  @keyframes eggShake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
  .egg .nm { font-family: var(--f-display); font-size: 14.5px; line-height: 1.1; }
  .egg .odds { font-size: 11px; line-height: 1.35; }
  .egg .btn { width: 100%; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot { height: 76px; border-radius: 16px; border: 2px dashed rgba(255,255,255,.18); display: grid; place-items: center; font-size: 12px; color: var(--muted); position: relative; background: rgba(0,0,0,.2); }
  .slot.full { border-style: solid; border-width: 3px; font-size: 38px; }
  .petsum { font-size: 13px; margin-top: 8px; color: var(--lime); font-weight: 600; text-align: center; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 8px; }
  .pet { position: relative; border-radius: 16px; padding: 8px 4px 7px; background: rgba(255,255,255,.05); border: 3px solid var(--rc, #555); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; transition: transform .1s; }
  .pet:hover { transform: translateY(-2px); }
  .pet .e { font-size: 34px; filter: drop-shadow(0 0 8px var(--rg, transparent)); }
  .pet .n { font-size: 11.5px; font-weight: 600; line-height: 1.15; }
  .pet .r { font-size: 10.5px; font-family: var(--f-display); color: var(--rc); letter-spacing: .03em; }
  .pet .lv { position: absolute; top: 3px; left: 5px; font-family: var(--f-display); font-size: 11px; color: var(--gold); }
  .pet.eq::after { content: ''; position: absolute; top: -8px; right: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--green) var(--ic-check) center / 72% no-repeat; border: 2px solid var(--stroke); }
  .rgbc { animation: rgbBorder 2s linear infinite; }
  @keyframes rgbBorder { 0% { border-color: #ff004c; } 20% { border-color: #ffe600; } 40% { border-color: #2bff88; } 60% { border-color: #00d5ff; } 80% { border-color: #ff2bd6; } 100% { border-color: #ff004c; } }

  /* style */
  .skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
